<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>言葉のプラネタリウム | AI Book Shelf</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b101e;
      --text-color: #e2e8f0;
      --accent: #38bdf8;
    }
    
    body {
      margin: 0; padding: 0; font-family: 'Zen Maru Gothic', sans-serif;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      color: var(--text-color);
      min-height: 200vh; /* 星を探すためにスクロール可能にする */
      overflow-x: hidden;
    }

    /* ローディング */
    #loading {
      position: fixed; inset: 0; background: var(--bg-color);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999; transition: opacity 1s ease;
    }
    .loading-star {
      width: 20px; height: 20px; background: white; border-radius: 50%;
      box-shadow: 0 0 20px white, 0 0 40px var(--accent);
      animation: twinkle 1.5s infinite alternate; margin-bottom: 20px;
    }

    /* ヘッダー */
    .top-nav {
      position: fixed; top: 0; left: 0; width: 100%; padding: 20px;
      background: linear-gradient(to bottom, rgba(9,10,15,0.8), transparent);
      z-index: 100; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center;
    }
    .back-btn {
      color: white; text-decoration: none; font-size: 14px; font-weight: 700;
      background: rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 50px;
      backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.2); transition: 0.3s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.2); }
    .page-title { margin: 0; font-size: 16px; font-weight: 400; letter-spacing: 3px; color: #94a3b8; }

    /* 星空キャンバス */
    #starsContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    
    .star {
      position: absolute; background: white; border-radius: 50%;
      box-shadow: 0 0 10px rgba(255,255,255,0.8); cursor: pointer;
      animation: floatStar 4s infinite alternate ease-in-out;
      /* タップしやすくするための透明な当たり判定 */
    }
    .star::before { content: ""; position: absolute; top: -15px; left: -15px; right: -15px; bottom: -15px; }
    .star:hover { transform: scale(1.5); box-shadow: 0 0 20px var(--accent); }

    @keyframes floatStar {
      0% { transform: translateY(0px); opacity: 0.7; }
      100% { transform: translateY(-10px); opacity: 1; }
    }
    @keyframes twinkle {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    /* モーダル（観測結果） */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background: rgba(9, 10, 15, 0.85); z-index: 2000; justify-content: center; align-items: center;
      backdrop-filter: blur(15px); padding: 20px; box-sizing: border-box;
    }
    .modal-content {
      background: rgba(255, 255, 255, 0.05); padding: 50px 40px; border-radius: 30px;
      width: 100%; max-width: 600px; border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 30px 60px rgba(0,0,0,0.5); text-align: center;
      animation: popModal 0.6s cubic-bezier(0.19, 1, 0.22, 1);
    }
    @keyframes popModal { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .phrase-display {
      font-size: 24px; font-weight: 700; line-height: 1.6; margin-bottom: 30px;
      color: #fff; text-shadow: 0 0 15px rgba(255,255,255,0.3); font-family: serif; letter-spacing: 1px;
    }
    
    .ai-intro-box {
      font-size: 15px; line-height: 2; color: #cbd5e1; background: rgba(0,0,0,0.3);
      padding: 25px; border-radius: 20px; margin-bottom: 40px; text-align: left;
      border-left: 3px solid var(--accent); min-height: 100px; display: flex; align-items: center; justify-content: center;
    }

    /* 伏せられた正体エリア */
    #revealArea { display: none; margin-top: 30px; padding-top: 30px; border-top: 1px dashed rgba(255,255,255,0.2); animation: fadeIn 1s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: translateY(0);} }
    .book-cover { width: 100px; border-radius: 8px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); margin-bottom: 15px; }
    .book-title { font-size: 18px; font-weight: 700; color: white; margin-bottom: 5px;}
    .book-author { font-size: 13px; color: #94a3b8; margin-bottom: 20px;}

    /* ボタン群 */
    .btn {
      padding: 15px 30px; border-radius: 50px; border: none; font-family: inherit;
      font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.3s;
    }
    .btn-primary { background: white; color: #0f172a; box-shadow: 0 0 20px rgba(255,255,255,0.2); }
    .btn-primary:hover { background: var(--accent); color: white; box-shadow: 0 0 30px var(--accent); }
    .btn-close { background: transparent; color: #94a3b8; border: 1px solid rgba(255,255,255,0.2); margin-top: 20px; }
    .btn-close:hover { background: rgba(255,255,255,0.1); color: white; }

    @media (max-width: 767px) {
      .phrase-display { font-size: 18px; }
      .modal-content { padding: 30px 20px; }
      .ai-intro-box { font-size: 13px; padding: 15px; }
      .btn { width: 100%; box-sizing: border-box; margin-bottom: 10px;}
    }
  </style>
</head>
<body>

<div id="loading">
  <div class="loading-star"></div>
  <p style="font-weight:700; letter-spacing:3px; color:#cbd5e1; font-size:14px;">本棚の奥から、言葉の星を抽出しています...</p>
</div>

<div class="top-nav">
  <a href="index.html" class="back-btn">← 本棚へ戻る</a>
  <h1 class="page-title">言葉のプラネタリウム</h1>
</div>

<div id="starsContainer"></div>

<!-- モーダル -->
<div id="starModal" class="modal-overlay">
  <div class="modal-content">
    <div id="modalPhrase" class="phrase-display"></div>
    <div id="modalAiIntro" class="ai-intro-box"></div>
    
    <div id="actionArea">
      <button id="revealBtn" class="btn btn-primary" onclick="revealBook()">この言葉が眠る物語を見る</button>
    </div>

    <div id="revealArea">
      <img id="revealCover" class="book-cover" src="">
      <div id="revealTitle" class="book-title"></div>
      <div id="revealAuthor" class="book-author"></div>
      <a id="revealLink" href="#" target="_blank" class="btn btn-primary" style="display:inline-block; text-decoration:none;">感想を嗜む</a>
    </div>

    <button class="btn btn-close" onclick="closeModal()">空へ戻る</button>
  </div>
</div>

<script>
  // メインのGAS WebアプリURLを同じものに設定してください
  const API_URL = "https://script.google.com/macros/s/AKfycbxnivqaTxApYmc8wWPn8BUk5p_caL2n6dPAjau7_8xkva7rLCODuY8idJJe0GJ-dyrw/exec"; 
  
  let currentBookData = null;

  window.onload = async () => {
    try {
      const res = await fetch(API_URL);
      const data = await res.json();
      const allBooks = data.books || [];
      
      // フレーズを持っている本から星のデータを生成
      let starsData = [];
      allBooks.forEach(book => {
        if (book.words && book.words.length > 0) {
          book.words.forEach(word => {
            if(word && word !== "不明なタグ" && word !== "取得エラー") {
              starsData.push({ book: book, phrase: word });
            }
          });
        }
      });

      if(starsData.length === 0) {
        alert("観測できる言葉の星がまだありません。本棚の「Today's Words DB」に言葉を登録してください。");
      } else {
        generateStars(starsData);
      }
      
      // ローディング非表示
      const loader = document.getElementById("loading");
      loader.style.opacity = "0";
      setTimeout(() => loader.style.display = "none", 1000);

    } catch (e) {
      alert("星空の観測に失敗しました。");
    }
  };

  function generateStars(starsData) {
    const container = document.getElementById("starsContainer");
    const containerHeight = document.body.scrollHeight; // スクロール領域全体
    const containerWidth = document.body.clientWidth;

    starsData.forEach(data => {
      const star = document.createElement("div");
      star.className = "star";
      
      // ランダムな配置とサイズ
      const top = Math.random() * (containerHeight - 100) + 50; // 上下少し余白
      const left = Math.random() * (containerWidth - 50) + 20;
      const size = Math.random() * 4 + 2; // 2px ~ 6px
      
      star.style.top = `${top}px`;
      star.style.left = `${left}px`;
      star.style.width = `${size}px`;
      star.style.height = `${size}px`;
      star.style.animationDelay = `${Math.random() * 5}s`;

      star.onclick = () => openStarModal(data.book, data.phrase);
      container.appendChild(star);
    });
  }

  async function openStarModal(book, phrase) {
    currentBookData = book;
    
    // モーダル初期化
    document.getElementById("starModal").style.display = "flex";
    document.getElementById("modalPhrase").innerHTML = `「${phrase}」`;
    const introBox = document.getElementById("modalAiIntro");
    introBox.innerHTML = "<span style='opacity:0.5; animation:twinkle 1.5s infinite alternate;'>夜空の案内人が、この言葉の背景を読み解いています...</span>";
    
    document.getElementById("actionArea").style.display = "none";
    document.getElementById("revealArea").style.display = "none";

    // AIに紹介文をリクエスト
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "generateStarIntro", book: book, phrase: phrase })
      });
      const d = await res.json();
      introBox.innerHTML = d.intro.replace(/\n/g, "<br>");
      document.getElementById("actionArea").style.display = "block"; // ボタン表示
    } catch (e) {
      introBox.innerHTML = "申し訳ありません、雲がかかってうまく読み解けませんでした。";
      document.getElementById("actionArea").style.display = "block";
    }
  }

  function revealBook() {
    document.getElementById("actionArea").style.display = "none";
    const rArea = document.getElementById("revealArea");
    rArea.style.display = "block";
    
    document.getElementById("revealCover").src = currentBookData.image;
    document.getElementById("revealTitle").textContent = currentBookData.title;
    document.getElementById("revealAuthor").textContent = `著者：${currentBookData.author}`;
    
    const linkBtn = document.getElementById("revealLink");
    if(currentBookData.url && currentBookData.url !== "#") {
      linkBtn.href = currentBookData.url;
      linkBtn.style.display = "inline-block";
    } else {
      linkBtn.style.display = "none";
    }
  }

  function closeModal() {
    document.getElementById("starModal").style.display = "none";
    currentBookData = null;
  }
</script>
</body>
</html>
