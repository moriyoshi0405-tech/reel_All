<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Book Shelf | 読書コミュニティ</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ------------------------------------------
       1. 基本設定 & アニメーション
    ------------------------------------------ */
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: 'Zen Maru Gothic', sans-serif; background: #fdfdfd; color: #333; line-height: 1.6; }

    @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulseGacha { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
    @keyframes buttonPulse { 0% { box-shadow: 0 0 0 0 rgba(255, 140, 0, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(255, 140, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 140, 0, 0); } }

    /* ------------------------------------------
       2. ヘッダー & ナビゲーション
    ------------------------------------------ */
    .header { text-align: center; padding: 80px 20px 100px; position: relative; color: white; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; background: linear-gradient(-45deg, #2c3e50, #000000, #4ca1af, #2c3e50); background-size: 400% 400%; animation: gradientBG 15s ease infinite;}
    .header-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.2); z-index: 1; }
    .header-content { position: relative; z-index: 2; max-width: 800px; margin: auto; }
    .header h1 { font-size: 38px; margin: 0 0 20px 0; text-shadow: 0 2px 15px rgba(0,0,0,0.4); letter-spacing: 3px; font-weight: 700;}

    .nav-links { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 30px; }
    .nav-btn { background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 10px 20px; border-radius: 30px; font-size: 12px; font-weight: bold; cursor: pointer; backdrop-filter: blur(8px); transition: all 0.3s ease; text-decoration: none;}
    .nav-btn:hover { background: white; color: #2c3e50; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }

    .shelf-mood { background: rgba(255, 255, 255, 0.18); backdrop-filter: blur(10px); display: inline-block; padding: 10px 25px; border-radius: 40px; font-size: 14px; border: 1px solid rgba(255,255,255,0.3); }

    .admin-tools { position: absolute; top: 15px; right: 15px; z-index: 100; display: flex; gap: 8px;}
    .admin-btn { font-size: 10px; padding: 6px 14px; border-radius: 8px; cursor: pointer; color: white; transition: 0.3s; backdrop-filter: blur(5px); font-family: inherit; font-weight: bold; border: 1px solid rgba(255,255,255,0.2); background: rgba(0, 0, 0, 0.5);}

    .container { max-width: 1100px; margin: auto; padding: 20px; }

    /* ------------------------------------------
       3. AI相談 & ガチャ
    ------------------------------------------ */
    .gacha-section { text-align: center; margin-top: -50px; margin-bottom: 60px; position: relative; z-index: 90; }
    .gacha-btn { background: linear-gradient(45deg, #ff6b6b, #ff8e53); color: white; font-size: 18px; font-weight: bold; padding: 18px 45px; border: none; border-radius: 60px; cursor: pointer; box-shadow: 0 10px 25px rgba(255, 107, 107, 0.4); transition: 0.3s; animation: pulseGacha 2s infinite; font-family: inherit; letter-spacing: 1px;}

    .ai-section { background: #fff; border: 1px solid #eef2f1; padding: 35px; border-radius: 25px; margin-bottom: 50px; box-shadow: 0 10px 40px rgba(0,0,0,0.03); }
    .ai-top-row { display: flex; align-items: center; gap: 25px; margin-bottom: 25px; }
    .ai-avatar-circle { width: 85px; height: 85px; border-radius: 50%; border: 4px solid #f0f4f3; object-fit: cover; box-shadow: 0 5px 15px rgba(0,0,0,0.08); background: #f9f9f9; transition: opacity 0.3s ease; }
    .ai-header { flex: 1; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;}
    .diagnose-btn { background: #e0f7fa; color: #00796b; border: 1px solid #b2ebf2; padding: 10px 20px; border-radius: 25px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; font-family: inherit;}

    .ai-input-group { display: flex; gap: 12px; flex-wrap: wrap;}
    .ai-btn { background: #2f3e2f; color: white; border: none; padding: 12px 30px; border-radius: 12px; cursor: pointer; transition: 0.3s; font-weight: bold; font-size: 15px;}

    .prompt-suggestions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .prompt-btn { font-size: 12px; padding: 10px 18px; border-radius: 30px; background: #f8faf9; color: #4a5a4a; border: 1px solid #e6eeea; cursor: pointer; transition: 0.2s; font-family: inherit; font-weight: bold;}
    .prompt-btn:hover { background: #e6f4ea; border-color: #2f3e2f; }

    #aiResultArea { display: none; margin-top: 35px; border-top: 1px dashed #e0e0e0; padding-top: 30px; animation: fadeIn 0.6s ease;}
    .ai-text { line-height: 1.9; font-size: 15px; color: #444; border-left: 5px solid #e6f4ea; padding: 20px 25px; background: #fafdfb; border-radius: 0 15px 15px 0; margin-bottom: 25px;}

    /* ------------------------------------------
       4. 本棚カード & グリッド
    ------------------------------------------ */
    .filter-section { margin-bottom: 40px; background: #fff; padding: 25px; border-radius: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.02); }
    .search-bar { width: 100%; padding: 16px 20px; border: 1px solid #e0e0e0; border-radius: 15px; font-size: 15px; box-sizing: border-box; margin-bottom: 20px; font-family: inherit;}
    .tags-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 25px; }
    .filter-tag { padding: 8px 16px; border-radius: 30px; background: #fff; border: 1px solid #ddd; font-size: 12px; cursor: pointer; transition: all 0.2s ease; color: #666; font-weight: bold;}
    .filter-tag.active { background: #2f3e2f; color: white; border-color: #2f3e2f; }
    
    .grid { display: grid; gap: 30px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); margin-bottom: 80px;}

    .card { 
      background: white; border-radius: 20px; padding: 30px 20px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.04); text-align: center; position: relative; 
      display: flex; flex-direction: column; align-items: center; 
      transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
      overflow: hidden; /* ラベルをはみ出させないため */
    }
    .card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }

    /* 🔴斜め New ラベル */
    .new-badge {
      position: absolute; top: 12px; right: -35px;
      background: #ff4757; color: white; font-size: 10px; font-weight: bold;
      padding: 5px 40px; transform: rotate(45deg);
      box-shadow: 0 2px 8px rgba(255, 71, 87, 0.3); z-index: 100;
      letter-spacing: 1px;
    }

    /* ランクバッジ */
    .rank-badge { position: absolute; top: -10px; left: -10px; padding: 8px 14px; border-radius: 50%; font-size: 13px; font-weight: bold; color: white; box-shadow: 0 5px 15px rgba(0,0,0,0.15); z-index: 90;}
    .rank-1 { background: linear-gradient(135deg, #ffd700, #daa520); } 
    .rank-2 { background: linear-gradient(135deg, #e0e0e0, #9e9e9e); color: #333; } 
    .rank-3 { background: linear-gradient(135deg, #cd7f32, #8b4513); } 

    .cover { width: 115px; height: 165px; object-fit: cover; border-radius: 8px; margin-bottom: 18px; box-shadow: 5px 10px 20px rgba(0,0,0,0.15); transition: 0.3s;}
    .card:hover .cover { transform: scale(1.05); }

    .title { font-weight: bold; font-size: 15px; margin: 0 0 8px 0; line-height: 1.4; color: #222; min-height: 42px; display: flex; align-items: center; justify-content: center;}
    .author { font-size: 12px; color: #888; margin-bottom: 10px; }
    
    /* 🔴評価スター */
    .rating { color: #f1c40f; font-size: 14px; margin-bottom: 15px; letter-spacing: 2px; }

    /* 🔴タグの調整（文字サイズに合わせる） */
    .card-tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 20px; min-height: 25px;}
    .card-tag { 
      font-size: 10px; background: #f1f3f2; color: #5a6a5a; 
      padding: 3px 10px; border-radius: 6px; font-weight: bold; 
      line-height: 1.2; display: inline-flex; align-items: center;
    }
    
    .button-area { width: 100%; margin-top: auto; z-index: 20; display: flex; flex-direction: column; gap: 8px;}
    .primary-buttons { display: flex; gap: 8px; }
    .card-btn { flex: 1; padding: 11px 5px; background: #333; color: #fff; text-decoration: none; border-radius: 15px; font-size: 11px; transition: 0.2s; font-weight: bold; text-align: center; border: none; cursor: pointer; font-family: inherit;}
    .card-btn.ai-summary-btn { background: #e0f2f1; color: #00695c; border: 1px solid #b2dfdb;}
    
    .action-row { display: flex; gap: 6px; width: 100%; }
    .action-row button { 
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; padding: 8px 2px; border-radius: 12px; font-size: 9px; border: 1px solid #f0f0f0; 
      background: #fdfdfd; cursor: pointer; font-family: inherit; font-weight: bold; transition: all 0.2s ease; color: #666;
    }
    .action-row button span { font-size: 14px; }
    .like-btn.liked { background: #fff1f2; color: #ff4757; border-color: #ff4757; }
    .read-btn.read { background: #f0f9fa; color: #4ca1af; border-color: #4ca1af; }
    .save-btn.saved { background: #fff7ed; color: #d35400; border-color: #d35400; }

    /* ------------------------------------------
       5. 処方箋 & プロフィール
    ------------------------------------------ */
    .prescription-section { background: #fff; border-radius: 30px; padding: 50px 40px; margin-bottom: 80px; border: 1px solid #e1f5fe; box-shadow: 0 15px 50px rgba(1, 87, 155, 0.04); scroll-margin-top: 40px; }
    .prescription-header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; justify-content: center;}
    .prescription-title { font-size: 26px; font-weight: bold; color: #01579b; margin: 0; }
    .prescription-input-group { display: flex; gap: 15px; margin: 30px auto 0; max-width: 700px; }
    .prescribe-btn { background: #01579b; color: white; border: none; padding: 15px 40px; border-radius: 40px; cursor: pointer; font-weight: bold; transition: all 0.3s ease; box-shadow: 0 8px 20px rgba(1, 87, 155, 0.2); font-size: 15px;}

    .admin-profile-section { margin-bottom: 80px; padding: 0 10px; scroll-margin-top: 40px; }
    .admin-profile-card { max-width: 750px; margin: auto; background: #fff; border-radius: 25px; padding: 40px; display: flex; align-items: center; gap: 35px; box-shadow: 0 10px 40px rgba(0,0,0,0.03); border: 1px solid #e0f2e9; position: relative; overflow: hidden;}
    .admin-profile-card::before { content: ""; position: absolute; top: 0; left: 0; width: 8px; height: 100%; background: #4ca1af; }
    .admin-avatar { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 4px solid #f9fbfb; box-shadow: 0 5px 15px rgba(0,0,0,0.08);}
    .admin-name { margin: 0 0 12px 0; font-size: 22px; color: #2f3e2f; font-weight: 700; line-height: 1.4;}

    .reader-section { padding: 80px 20px; background: #fffaf4; border-radius: 40px; border: 2px solid #faebd7; scroll-margin-top: 40px; margin-bottom: 60px;}
    .reader-section h2 { text-align: center; color: #d35400; font-size: 26px; margin-top: 0; margin-bottom: 45px; letter-spacing: 2px;}
    .reader-grid { display: grid; gap: 30px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .reader-card { background: white; border-radius: 20px; padding: 40px 30px; position: relative; display: flex; flex-direction: column;}
    .reader-card::before { content: "💬"; position: absolute; top: -20px; left: -15px; font-size: 45px; transform: rotate(-10deg); color: #ffcc80; opacity: 0.6; z-index: 10;}
    .reader-quote { font-size: 15px; background: #fdfbf7; padding: 25px; border-radius: 15px; border-left: 5px solid #ffcc80; margin-bottom: 25px; flex-grow: 1; line-height: 1.8; color: #444; z-index: 20; position: relative;}

    /* ------------------------------------------
       6. ボタン・モーダル
    ------------------------------------------ */
    .floating-btn {
      position: fixed; bottom: 35px; right: 35px;
      background: linear-gradient(135deg, #ff8c00, #ff6b6b); color: white;
      padding: 18px 35px; border-radius: 50px; border: none;
      font-weight: bold; font-family: inherit; cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 140, 0, 0.4);
      z-index: 1000; transition: all 0.3s ease; font-size: 15px;
      animation: buttonPulse 3s infinite;
    }
    .floating-btn:hover { transform: scale(1.1) translateY(-5px); }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(5px); padding: 20px; box-sizing: border-box;}
    .modal-content { background: white; padding: 40px; border-radius: 30px; width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 60px rgba(0,0,0,0.3); animation: popModal 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);}
    @keyframes popModal { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    #loading { position: fixed; inset: 0; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5000; }
    .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 4px solid #2f3e2f; border-radius: 50%; animation: spin 1s linear infinite; }

    @media (max-width: 767px) {
      .header h1 { font-size: 26px; padding-top: 25px; }
      .admin-tools { right: 10px; top: 10px; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
      .card { padding: 20px 10px; }
      .title { font-size: 12px; min-height: 36px; }
      .card-tags, .author, .rating { display: none; }
      .prescription-input-group { flex-direction: column; align-items: stretch; }
      .prescribe-btn { width: 100%; }
      .admin-profile-card { flex-direction: column; text-align: center; }
      .floating-btn { bottom: 20px; right: 20px; padding: 15px 25px; font-size: 13px; }
    }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p style="margin-top: 20px; font-size: 15px; font-weight:bold; color:#2f3e2f;">本棚を整頓しています...</p>
</div>

<!-- 管理者用：本を追加モーダル -->
<div id="adminAddModal" class="modal-overlay">
  <div class="modal-content">
    <h3 style="color:#2e7d32;">📖 AI書籍スカウト（新刊追加）</h3>
    <div style="background:#f1f8f5; padding:20px; border-radius:15px; margin-bottom:25px; border:1px solid #e8f5e9;">
      <label style="font-size:12px; font-weight:bold; color:#2e7d32;">Amazon URL / タイトルで自動入力</label>
      <div style="display:flex; gap:10px; margin-top:8px;">
        <input type="text" id="isbnInput" placeholder="URLや本の名前を入力..." style="flex:1;">
        <button onclick="fetchISBN()" id="fetchBtn" style="background:#2e7d32; color:white; border:none; border-radius:10px; padding:0 20px; cursor:pointer; font-weight:bold;">スカウト</button>
      </div>
    </div>
    <div style="display:grid; gap:15px;">
      <input type="text" id="addTitle" placeholder="書籍名">
      <input type="text" id="addAuthor" placeholder="著者名">
      <input type="text" id="addImage" placeholder="書影URL">
      <div style="display:flex; align-items:center; gap:15px;">
        <label style="font-size:13px; font-weight:bold; color:#555;">評価：</label>
        <select id="addRating" style="flex:1;"><option value="5">★★★★★</option><option value="4">★★★★☆</option><option value="3">★★★☆☆</option><option value="2">★★☆☆☆</option><option value="1">★☆☆☆☆</option></select>
      </div>
      <textarea id="addReel" placeholder="キャッチコピー（カード表示用）" style="height:60px;"></textarea>
      <textarea id="addReview" placeholder="レビュー全文（AI学習用）" style="height:150px;"></textarea>
    </div>
    <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 30px;">
      <button onclick="closeAdminAddModal()" style="padding:12px 25px; background:#eee; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">キャンセル</button>
      <button id="adminSubmitBtn" onclick="submitAdminBook()" style="padding:12px 30px; background:#2e7d32; color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">本棚に並べる</button>
    </div>
  </div>
</div>

<!-- 既存モーダル群 -->
<div id="gachaModal" class="modal-overlay"><div class="modal-content"><div id="gachaTitle" style="font-size:20px; font-weight:bold; text-align:center; margin-bottom:20px; color:#d35400;"></div><div style="width:160px; height:230px; margin:25px auto; border-radius:12px; overflow:hidden; box-shadow:0 15px 35px rgba(0,0,0,0.2);"><img id="gachaSlotImg" src="" style="width:100%; height:100%; object-fit:cover;"></div><div id="gachaDesc" style="text-align:center; font-size:15px; margin-bottom:30px; line-height:1.6;"></div><div id="gachaActions" style="display:none; gap:12px; justify-content:center;"><button onclick="closeGacha()" style="padding:12px 25px; border-radius:15px; border:none; background:#eee; cursor:pointer; font-weight:bold;">閉じる</button><button id="gachaLinkBtn" style="padding:12px 25px; border-radius:15px; border:none; background:#ff8c00; color:white; cursor:pointer; font-weight:bold;">詳細をみる</button></div></div></div>
<div id="summaryModal" class="modal-overlay"><div class="modal-content"><h3 id="summaryBookTitle" style="color:#00695c;">📖 本の内容を解説</h3><div id="summaryText" class="ai-text" style="border-left-color:#00695c;"></div><div style="text-align:right;"><button onclick="closeSummaryModal()" style="padding:12px 25px; border-radius:10px; border:none; background:#eee; cursor:pointer; font-weight:bold;">閉じる</button></div></div></div>
<div id="diagnoseModal" class="modal-overlay"><div class="modal-content"><h3>🩺 読書カルテ診断</h3><p style="font-size:14px; color:#555; margin-bottom:15px;">あなたの好みの作品を3つ教えてください。</p><textarea id="diagnoseInput" placeholder="作品名を書いてね..." style="width:100%; height:140px; margin-bottom:20px;"></textarea><div style="text-align:right;"><button onclick="closeDiagnoseModal()" style="padding:12px 25px; border:none; background:#eee; border-radius:10px; font-weight:bold;">キャンセル</button><button onclick="runDiagnose()" style="padding:12px 25px; border:none; background:#00796b; color:white; border-radius:10px; font-weight:bold; margin-left:10px;">分析開始</button></div></div></div>
<div id="submitModal" class="modal-overlay"><div class="modal-content"><h3>💡 おすすめ本を教える</h3><input type="text" id="submitTitle" placeholder="書籍名（必須）" style="width:100%; margin-bottom:15px;"><input type="text" id="submitAuthor" placeholder="著者名" style="width:100%; margin-bottom:15px;"><textarea id="submitReason" placeholder="おすすめ理由" style="width:100%; height:120px;"></textarea><div style="text-align:right; margin-top:20px;"><button onclick="closeModal()" style="padding:12px 25px; border:none; background:#eee; border-radius:10px; font-weight:bold;">キャンセル</button><button onclick="submitBook()" style="padding:12px 25px; border:none; background:#2f3e2f; color:white; border-radius:10px; font-weight:bold; margin-left:10px;">管理人に届ける</button></div></div></div>

<!-- メイン -->
<div class="header">
  <div class="header-overlay"></div>
  <div class="admin-tools">
    <button class="admin-btn" onclick="openAdminAddModal()">📖 本を追加</button>
    <button id="updateDbBtn" class="admin-btn">🔄 AI学習更新</button>
  </div>
  <div class="header-content">
    <h1>AI Book Shelf</h1>
    <div class="nav-links">
      <a href="#adminProfile" class="nav-btn">💼 管理人プロフィール</a>
      <a href="#prescriptionSection" class="nav-btn">💊 本の処方箋をもらう</a>
      <a href="#readerSection" class="nav-btn">👑 みんなのおすすめ</a>
    </div>
    <div id="shelfMood" class="shelf-mood">本棚を読み込み中...</div>
  </div>
</div>

<div class="container">
  <div class="gacha-section"><button class="gacha-btn" onclick="playGacha()">🎲 運命の一冊ガチャを回す</button></div>

  <!-- AI相談 -->
  <div class="ai-section">
    <div class="ai-top-row">
      <img id="aiChatAvatar" class="ai-avatar-circle" src="">
      <div class="ai-header"><div style="font-weight:bold; font-size:20px; color:#2f3e2f;">🤖 AI司書に相談する</div><button class="diagnose-btn" onclick="openDiagnoseModal()">🩺 読書カルテ診断</button></div>
    </div>
    <div class="ai-input-group">
      <select id="aiPersona" class="persona-select" onchange="updateChatAvatar('normal')"><option value="normal">👓 丁寧な司書さん</option><option value="hot">🔥 熱血カリスマ書店員</option><option value="cat">🐱 気まぐれな猫</option></select>
      <input type="text" id="aiQuery" placeholder="どんな本が読みたいですか？" style="flex:1;"><button id="aiBtn" class="ai-btn" onclick="runAiConsult()">相談する</button>
    </div>
    <div class="prompt-suggestions"><button class="prompt-btn" onclick="setAiPrompt('☕ のんびりエッセイを読みたい')">☕ のんびり</button><button class="prompt-btn" onclick="setAiPrompt('😭 思いっきり泣ける恋愛小説')">😭 泣きたい</button><button class="prompt-btn" onclick="setAiPrompt('🚀 元気がもらえる本')">🚀 元気がほしい</button></div>
    <div id="aiResultArea"><div id="aiText" class="ai-text"></div><div id="aiBooksGrid" class="grid"></div><div style="text-align:center;"><button class="nav-btn" style="color:#2f3e2f; border-color:#2f3e2f;" onclick="resetAi()">リセット</button></div></div>
  </div>

  <div class="filter-section">
    <input type="text" id="searchBar" class="search-bar" placeholder="タイトル、著者名で検索..." oninput="renderAll()">
    <div id="tagsContainer" class="tags-container"></div>
    <div class="sort-options"><button id="sortNewBtn" class="sort-btn active" onclick="changeSortMode('new')">📅 新着順</button><button id="sortLikeBtn" class="sort-btn" onclick="changeSortMode('like')">❤️ 人気順</button><button id="myShelfBtn" class="sort-btn my-shelf-btn" onclick="toggleMyShelf()">🔖 保存済み</button></div>
  </div>

  <div id="grid" class="grid"></div>

  <!-- 処方箋 -->
  <div id="prescriptionSection" class="prescription-section">
    <div class="prescription-header"><img id="pharmacistAvatar" class="ai-avatar-circle" src=""><div class="prescription-title">💊 AI本の処方箋</div></div>
    <div class="prescription-input-group"><input type="text" id="worryInput" placeholder="今のお悩みは何ですか？" style="flex:1; border-radius:30px; padding-left:25px;"><button class="prescribe-btn" onclick="runPrescription()">処方箋をもらう</button></div>
    <div id="prescriptionResultArea">
      <div class="prescription-card"><div class="prescription-book-box" id="prescribedBookBox"></div><div id="prescriptionText"></div></div>
      <div style="text-align:center; margin-top:30px;"><button class="nav-btn" style="color:#01579b; border-color:#01579b;" onclick="resetPrescription()">もう一度相談する</button></div>
    </div>
  </div>

  <!-- プロフィール -->
  <div id="adminProfile" class="admin-profile-section"><div class="admin-profile-card"><img src="ChatGPT Image 2026年5月6日 19_04_17.png" class="admin-avatar"><div class="admin-info"><h3 class="admin-name">💼 管理人<br>s h o t a</h3><p class="admin-bio">恋愛小説、海外文学、エッセイを中心に物語を読んでいます。一冊の本が誰かの人生を変える瞬間を信じて、この本棚を運営しています。年末のベスト5選びが一番の楽しみです。</p></div></div></div>

  <!-- 読者 -->
  <div id="readerSection" class="reader-section"><h2>👑 みんなのおすすめ人気本</h2><div id="readerGrid" class="reader-grid"></div></div>
</div>

<button class="floating-btn" onclick="openModal()">💡 おすすめ本を教える</button>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxnivqaTxApYmc8wWPn8BUk5p_caL2n6dPAjau7_8xkva7rLCODuY8idJJe0GJ-dyrw/exec"; 
  
  const AI_AVATARS = {
    normal: { normal: "司書＿通常.png", searching: "司書_探し中.png" },
    hot: { normal: "熱血_通常.png", searching: "熱血_探し中.png" },
    cat: { normal: "猫_通常.png", searching: "猫_探し中.png" },
    pharmacist: { normal: "処方箋_通常.png", searching: "処方箋_探し中.png" }
  };

  let allData = [], readerData = [], gachaPool = [], activeTags = [], currentSortMode = 'new', isMyShelfMode = false;
  let likedBooks = JSON.parse(localStorage.getItem('likedBooks')) || [], readBooks = JSON.parse(localStorage.getItem('readBooks')) || [], savedBooks = JSON.parse(localStorage.getItem('savedBooks')) || [];

  window.onload = async () => {
    updateChatAvatar('normal');
    document.getElementById('pharmacistAvatar').src = AI_AVATARS.pharmacist.normal;
    try {
      const res = await fetch(API_URL);
      const data = await res.json();
      allData = data.books || [];
      readerData = data.readerBooks || [];
      generateFilterTags(allData); renderAll(); fetchMood();
      gachaPool = [...allData.map(b => ({ ...b, type: 'admin' })), ...readerData.map(b => ({ ...b, type: 'reader' }))];
      document.getElementById("loading").style.display = "none";
    } catch (e) { alert("読込失敗。"); }
  };

  function updateChatAvatar(state) {
    const persona = document.getElementById('aiPersona').value;
    const img = document.getElementById('aiChatAvatar');
    if(img) { img.style.opacity = 0; setTimeout(() => { img.src = AI_AVATARS[persona][state]; img.style.opacity = 1; }, 200); }
  }

  async function fetchISBN() {
    const query = document.getElementById("isbnInput").value.trim();
    if(!query) return alert("URLまたはタイトルを入れてね。");
    const btn = document.getElementById("fetchBtn"); btn.disabled = true; btn.textContent = "...";
    try {
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "fetchBookInfo", query: query }) });
      const data = await res.json();
      if(data.status === "success") {
        document.getElementById("addTitle").value = data.title;
        document.getElementById("addAuthor").value = data.author;
        document.getElementById("addImage").value = data.image;
        document.getElementById("addReview").value = data.summary;
        alert("特定成功！");
      } else { alert(data.message); }
    } catch(e) { alert("失敗"); } finally { btn.disabled = false; btn.textContent = "スカウト"; }
  }

  async function submitAdminBook() {
    const pass = prompt("管理者の合言葉は？"); if(!pass) return;
    const data = {
      title: document.getElementById("addTitle").value, author: document.getElementById("addAuthor").value,
      image: document.getElementById("addImage").value, rating: document.getElementById("addRating").value,
      reel: document.getElementById("addReel").value, review: document.getElementById("addReview").value
    };
    if(!data.title) return alert("タイトル必須");
    const btn = document.getElementById("adminSubmitBtn"); btn.disabled = true;
    try {
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "adminAddBook", password: pass, data: data }) });
      const resData = await res.json();
      if(resData.status === "success") { alert("追加成功！AI学習を更新してね。"); closeAdminAddModal(); location.reload(); } else { alert(resData.message); }
    } catch(e) { alert("登録失敗"); } finally { btn.disabled = false; }
  }

  function openAdminAddModal() { document.getElementById("adminAddModal").style.display = "flex"; }
  function closeAdminAddModal() { document.getElementById("adminAddModal").style.display = "none"; }

  async function runAiConsult() {
    const q = document.getElementById("aiQuery").value; if (!q) return;
    const btn = document.getElementById("aiBtn"); btn.disabled = true; updateChatAvatar('searching');
    document.getElementById("aiResultArea").style.display = "block";
    document.getElementById("aiText").innerHTML = "本棚から物語を紐解いています...";
    try {
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ message: q, persona: document.getElementById("aiPersona").value }) });
      const d = await res.json(); document.getElementById("aiText").innerHTML = d.result.replace(/\n/g, "<br>");
      if (d.recommendedBooks) {
        const updated = d.recommendedBooks.map(aib => [...allData, ...readerData].find(f => f.id === aib.id) || aib);
        document.getElementById("aiBooksGrid").innerHTML = updated.map(b => generateCardHTML(b, -1)).join("");
        setTimeout(observeCards, 100);
      }
    } catch (e) { document.getElementById("aiText").innerHTML = "迷子になりました。再度相談してください。"; } finally { btn.disabled = false; updateChatAvatar('normal'); }
  }

  async function showSummary(id) {
    const book = [...allData, ...readerData].find(b => b.id === id); if (!book) return;
    document.getElementById("summaryBookTitle").textContent = "📖 AI司書の解説：" + book.title;
    document.getElementById("summaryText").innerHTML = "物語の魂を凝縮しています..."; 
    document.getElementById("summaryModal").style.display = "flex";
    try {
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getSummary", bookData: book }) });
      const d = await res.json(); document.getElementById("summaryText").innerHTML = d.summary.replace(/\n/g, "<br>");
    } catch (e) { document.getElementById("summaryText").innerHTML = "失敗しました。"; }
  }

  function generateCardHTML(book, index) {
    const isL = likedBooks.includes(book.id), isR = readBooks.includes(book.id), isS = savedBooks.includes(book.id);
    const n = (new Date() - new Date(book.updated)) / 86400000 <= 7 ? '<div class="new-badge">New!</div>' : '';
    let badge = (currentSortMode === 'like' && index >= 0 && index <= 2 && book.likes > 0) ? `<div class="rank-badge rank-${index+1}">${index+1}位</div>` : "";
    
    // 🔴評価表示復活
    let r = ""; if (book.rating) { const s = parseInt(book.rating); if(!isNaN(s)) r = `<div class="rating">${"★".repeat(s)}${"☆".repeat(5-s)}</div>`; }

    return `
      <div class="card">${n}${badge}
        <img src="${book.image}" class="cover" onerror="this.src='https://via.placeholder.com/110x165'">
        <div class="title">${book.title}</div>
        <div class="author">${book.author}</div>
        ${r}
        <div class="card-tags">${book.tags.map(t => `<span class="card-tag">${t}</span>`).join("")}</div>
        <div class="button-area">
          <div class="primary-buttons">
            <a href="${book.url}" target="_blank" class="card-btn">感想を見る</a>
            <button onclick="showSummary('${book.id}')" class="card-btn ai-summary-btn">📖 解説</button>
          </div>
          <div class="action-row">
            <button onclick="handleAction('${book.id}', 'likeBook')" class="like-btn ${isL?'liked':''}"><span>❤️</span>${book.likes}<br>読みたい</button>
            <button onclick="handleAction('${book.id}', 'readBook')" class="read-btn ${isR?'read':''}"><span>✅</span>${book.reads}<br>既読</button>
            <button onclick="toggleSave('${book.id}')" class="save-btn ${isS?'saved':''}"><span>🔖</span><br>${isS?'保存中':'保存'}</button>
          </div>
        </div>
      </div>`;
  }

  function generateReaderCardHTML(book, i) {
    const isL = likedBooks.includes(book.id);
    return `<div class="reader-card">
        <div class="reader-quote">${book.reason.replace(/\n/g, '<br>')}</div>
        <div style="font-weight:bold; font-size:15px; color:#222; margin-bottom:5px;">📖 ${book.title}</div>
        <div style="font-size:12px; color:#888; margin-bottom:15px;">著者：${book.author}</div>
        <div class="action-row" style="margin-top:auto;"><button onclick="handleAction('${book.id}', 'likeBook')" class="like-btn ${isL?'liked':''}" style="flex:none; width:85px;"><span>❤️</span>${book.likes}<br>いいね</button></div>
      </div>`;
  }

  async function runPrescription() {
    const w = document.getElementById("worryInput").value.trim(); if (!w) return;
    const btn = document.getElementById("prescribeBtn"); btn.disabled = true; document.getElementById("pharmacistAvatar").src = AI_AVATARS.pharmacist.searching;
    try {
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "prescribe", message: w }) });
      const d = await res.json();
      const fresh = [...allData, ...readerData].find(f => f.id === d.recommendedBook.id) || d.recommendedBook;
      document.getElementById("prescribedBookBox").innerHTML = `<img src="${fresh.image}"><div><div style="font-weight:bold; font-size:16px; color:#01579b;">💊 処方：『${fresh.title}』</div><button onclick="showSummary('${fresh.id}')" style="margin-top:8px; font-size:11px; border:none; background:#e1f5fe; color:#01579b; padding:5px 12px; border-radius:10px; cursor:pointer; font-weight:bold;">この物語の効能を見る</button></div>`;
      document.getElementById("prescriptionText").innerHTML = d.prescription.replace(/\n/g, "<br>");
      document.getElementById("prescriptionResultArea").style.display = "block";
    } catch(e) { alert("失敗"); } finally { btn.disabled = false; document.getElementById("pharmacistAvatar").src = AI_AVATARS.pharmacist.normal; }
  }

  /* --- 補助ロジック --- */
  function renderAll() {
    const s = document.getElementById("searchBar").value.toLowerCase();
    let f = allData.filter(b => (b.title + b.author).toLowerCase().includes(s) && activeTags.every(t => b.tags.includes(t)) && (isMyShelfMode ? savedBooks.includes(b.id) : true));
    if (currentSortMode === 'new') f.sort((a, b) => new Date(b.updated) - new Date(a.updated)); else f.sort((a, b) => b.likes - a.likes);
    document.getElementById("grid").innerHTML = f.map((b, i) => generateCardHTML(b, i)).join("");
    document.getElementById("readerGrid").innerHTML = [...readerData].sort((a,b) => b.likes - a.likes).map((b, i) => generateReaderCardHTML(b, i)).join("");
    setTimeout(observeCards, 100);
  }
  function setAiPrompt(p) { document.getElementById("aiQuery").value = p; runAiConsult(); }
  function resetAi() { document.getElementById("aiQuery").value = ""; document.getElementById("aiResultArea").style.display = "none"; }
  function toggleMyShelf() { isMyShelfMode = !isMyShelfMode; document.getElementById("myShelfBtn").classList.toggle("active"); renderAll(); }
  function changeSortMode(m) { currentSortMode = m; document.getElementById("sortNewBtn").classList.toggle("active", m === 'new'); document.getElementById("sortLikeBtn").classList.toggle("active", m === 'like'); renderAll(); }
  async function fetchMood() { try { const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getMood" }) }); const d = await res.json(); document.getElementById("shelfMood").textContent = "✨ " + d.mood; } catch(e){} }
  function closeModal() { document.getElementById("submitModal").style.display = "none"; }
  function openModal() { document.getElementById("submitModal").style.display = "flex"; }
  function openDiagnoseModal() { document.getElementById("diagnoseModal").style.display = "flex"; }
  function closeDiagnoseModal() { document.getElementById("diagnoseModal").style.display = "none"; }
  function closeSummaryModal() { document.getElementById("summaryModal").style.display = "none"; }
  function closeGacha() { document.getElementById('gachaModal').style.display = 'none'; }
  function resetPrescription() { document.getElementById("worryInput").value = ""; document.getElementById("prescriptionResultArea").style.display = "none"; }
  async function handleAction(id, a) { const l = a === 'likeBook' ? likedBooks : readBooks; if (l.includes(id)) return; l.push(id); localStorage.setItem(a === 'likeBook' ? 'likedBooks' : 'readBooks', JSON.stringify(l)); if (a === 'readBook') spawnConfetti(); renderAll(); fetch(API_URL, { method: "POST", body: JSON.stringify({ action: a, pageId: id }) }); }
  function toggleSave(id) { if (savedBooks.includes(id)) savedBooks = savedBooks.filter(i => i !== id); else savedBooks.push(id); localStorage.setItem('savedBooks', JSON.stringify(savedBooks)); renderAll(); }
  function spawnConfetti() { for (let i = 0; i < 50; i++) { const c = document.createElement('div'); c.style.cssText = `position:fixed; width:10px; height:10px; background:${['#ffc0cb','#ffb6c1','#ff69b4','#fff0f5'][Math.floor(Math.random()*4)]}; left:${Math.random()*100}vw; top:-10px; border-radius:50%; animation: fall ${Math.random()*3+2}s linear forwards; z-index:4000;`; document.body.appendChild(c); setTimeout(() => c.remove(), 5000); } }
  function observeCards() { const o = new IntersectionObserver((es) => { es.forEach(e => { if (e.isIntersecting) { setTimeout(() => e.target.classList.add('show'), 50); o.unobserve(e.target); } }); }, { threshold: 0.1 }); document.querySelectorAll('.card:not(.show), .reader-card:not(.show)').forEach(c => o.observe(c)); }
  function generateFilterTags(bs) { const c = document.getElementById("tagsContainer"); c.innerHTML = ""; const ts = new Set(); bs.forEach(b => b.tags.forEach(t => ts.add(t))); ts.forEach(t => { const b = document.createElement("button"); b.className = "filter-tag"; b.textContent = t; b.onclick = () => { b.classList.toggle("active"); if (activeTags.includes(t)) activeTags = activeTags.filter(x => x !== t); else activeTags.push(t); renderAll(); }; c.appendChild(b); }); }
  function playGacha() { if (gachaPool.length === 0) return; const m = document.getElementById('gachaModal'), s = document.getElementById('gachaSlotImg'), t = document.getElementById('gachaTitle'), d = document.getElementById('gachaDesc'), a = document.getElementById('gachaActions'); m.style.display = 'flex'; a.style.display = 'none'; t.innerHTML = "探索中..."; let c = 0; const i = setInterval(() => { s.src = gachaPool[Math.floor(Math.random() * gachaPool.length)].image; if (++c > 20) { clearInterval(i); const w = gachaPool[Math.floor(Math.random() * gachaPool.length)]; s.src = w.image; t.innerHTML = "✨ 今、あなたが出会うべき一冊 ✨"; d.innerHTML = `<strong>『${w.title}』</strong><br>${w.author}`; a.style.display = 'flex'; if (w.url && w.url !== "#" && w.url !== "javascript:void(0)") document.getElementById('gachaLinkBtn').onclick = () => window.open(w.url, '_blank'); else document.getElementById('gachaLinkBtn').style.display = 'none'; } }, 100); }
  async function submitBook() { const t = document.getElementById("submitTitle").value, r = document.getElementById("submitReason").value; if (!t || !r) return alert("必須項目を埋めてね"); try { await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "submitBook", data: { title: t, author: document.getElementById("submitAuthor").value, reason: r } }) }); alert("管理人に届けました！"); closeModal(); } catch (e) { alert("失敗"); } }
  document.getElementById("updateDbBtn").onclick = async () => { const p = prompt("合言葉は？"); if (!p) return; const btn = event.target; btn.disabled = true; try { const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "updateDB", password: p }) }); const d = await res.json(); if (d.status === "success") { alert("学習完了！"); location.reload(); } else { alert(d.message); } } catch (e) { alert("エラー"); } finally { btn.disabled = false; } };
  async function runDiagnose() { const input = document.getElementById("diagnoseInput").value.trim(); if (!input) return; closeDiagnoseModal(); const rA = document.getElementById("aiResultArea"), aT = document.getElementById("aiText"), aG = document.getElementById("aiBooksGrid"); rA.style.display = "block"; aT.innerHTML = "あなたの深層心理を読書カルテにまとめています..."; aG.innerHTML = ""; try { const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "diagnose", message: input }) }); const data = await res.json(); aT.innerHTML = "<h4 style='color:#00796b;margin-top:0;'>🩺 shota式・読書傾向カルテ</h4>" + data.result.replace(/\n/g, "<br>"); if (data.recommendedBooks) { const up = data.recommendedBooks.map(aib => [...allData, ...readerData].find(f => f.id === aib.id) || aib); aG.innerHTML = up.map(b => generateCardHTML(b, -1)).join(""); setTimeout(observeCards, 100); } } catch (e) { aT.innerHTML = "失敗しました。"; } }
</script>
</body>
</html>
