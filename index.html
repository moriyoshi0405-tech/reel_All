<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Book Shelf</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Zen Maru Gothic', sans-serif; background: #f9fbfb; color: #333; }
    
    /* ヘッダー背景（動くグラデーション） */
    .header { text-align: center; padding: 70px 20px 80px; position: relative; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; background: linear-gradient(-45deg, #2c3e50, #000000, #4ca1af, #2c3e50); background-size: 400% 400%; animation: gradientBG 15s ease infinite;}
    @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    
    .header-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.2); z-index: 1; }
    .header-content { position: relative; z-index: 2; }
    .header h1 { font-size: 34px; margin: 0 0 10px 0; text-shadow: 0 2px 10px rgba(0,0,0,0.5); letter-spacing: 2px;}
    .header p { font-size: 15px; margin: 0; text-shadow: 0 2px 10px rgba(0,0,0,0.5); opacity: 0.9;}
    
    /* 🔴修正：ボタンの配置を左上に移動 */
    .admin-tools { position: absolute; top: 10px; left: 10px; right: auto; z-index: 3;}
    .update-db-btn { font-size: 10px; padding: 5px 10px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; cursor: pointer; color: white; transition: 0.3s; backdrop-filter: blur(4px);}
    .update-db-btn:hover { background: rgba(255, 255, 255, 0.2); border-color: white;}
    
    .container { max-width: 900px; margin: auto; padding: 20px; }

    /* ガチャボタン */
    .gacha-section { text-align: center; margin-top: -40px; margin-bottom: 40px; position: relative; z-index: 10; }
    .gacha-btn { background: linear-gradient(45deg, #ff6b6b, #ff8e53); color: white; font-size: 16px; font-weight: bold; padding: 15px 40px; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4); transition: transform 0.2s, box-shadow 0.2s; animation: pulseGacha 2s infinite; font-family: 'Zen Maru Gothic', sans-serif; letter-spacing: 1px;}
    .gacha-btn:hover { transform: scale(1.05); box-shadow: 0 12px 25px rgba(255, 107, 107, 0.6); }
    @keyframes pulseGacha { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }

    /* ガチャモーダル */
    .gacha-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 3000; justify-content: center; align-items: center; backdrop-filter: blur(5px);}
    .gacha-content { background: #fff; padding: 40px 30px; border-radius: 20px; width: 90%; max-width: 380px; text-align: center; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.5); overflow: hidden;}
    .gacha-content::before { content:""; position:absolute; top:-50%; left:-50%; width:200%; height:200%; background: radial-gradient(circle, rgba(255,215,0,0.3) 0%, transparent 60%); animation: spinGlow 8s linear infinite; z-index: 0; display: none;}
    .gacha-content.result-mode::before { display: block; }
    @keyframes spinGlow { 100% { transform: rotate(360deg); } }
    .gacha-title { font-size: 20px; font-weight: bold; color: #333; z-index: 1; position: relative; line-height: 1.5; min-height: 60px;}
    .gacha-slot { width: 140px; height: 200px; margin: 20px auto; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.3); z-index: 1; position: relative; background:#eee;}
    .gacha-slot img { width: 100%; height: 100%; object-fit: cover;}
    .gacha-desc { font-size: 14px; color: #555; margin-bottom: 25px; z-index: 1; position: relative; min-height: 40px;}
    .gacha-actions { display: flex; gap: 10px; justify-content: center; z-index: 1; position: relative;}
    .gacha-action-btn { padding: 12px 20px; border-radius: 30px; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; font-family: 'Zen Maru Gothic', sans-serif; font-size: 14px; width: 100%;}
    .gacha-action-btn.primary { background: #ff8c00; color: white; box-shadow: 0 4px 10px rgba(255, 140, 0, 0.3);}
    .gacha-action-btn.secondary { background: #eee; color: #555; }
    .gacha-action-btn:hover { transform: translateY(-2px); filter: brightness(1.1);}
    @keyframes flashResult { 0% { filter: brightness(1); transform: scale(1); } 40% { filter: brightness(1.5); transform: scale(1.15) rotate(2deg); box-shadow: 0 0 50px rgba(255, 215, 0, 1); } 100% { filter: brightness(1); transform: scale(1); box-shadow: 0 10px 25px rgba(0,0,0,0.3); } }
    .flash-anim { animation: flashResult 0.8s ease-out forwards; }

    /* AIセクション */
    .ai-section { background: #fff; border: 1px solid #e0f2e9; padding: 25px; border-radius: 20px; margin-bottom: 30px; box-shadow: 0 8px 25px rgba(0,0,0,0.04); }
    .ai-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 15px;}
    .diagnose-btn { background: #e0f7fa; color: #00796b; border: 1px solid #b2ebf2; padding: 8px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; font-family: 'Zen Maru Gothic', sans-serif;}
    .diagnose-btn:hover { background: #b2ebf2; transform: translateY(-2px);}

    .ai-input-group { display: flex; gap: 10px; flex-wrap: wrap;}
    .persona-select { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: 'Zen Maru Gothic', sans-serif; background: #fff; cursor: pointer; outline: none;}
    input[type="text"] { flex: 1; min-width: 200px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: 'Zen Maru Gothic', sans-serif; outline: none; transition: 0.3s;}
    input[type="text"]:focus { border-color: #2f3e2f; box-shadow: 0 0 8px rgba(47,62,47,0.1); }
    .ai-btn { background: #2f3e2f; color: white; border: none; padding: 10px 25px; border-radius: 8px; cursor: pointer; transition: 0.3s; white-space: nowrap; font-weight: bold;}
    .ai-btn:hover { background: #4a5c4a; transform: translateY(-2px);}
    .ai-btn:disabled { background: #ccc; transform: none;}
    .reset-btn { background: #fff; color: #2f3e2f; border: 1px solid #2f3e2f; padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: 0.3s; white-space: nowrap; display: none; font-weight: bold;}
    .reset-btn:hover { background: #f0f0f0; }

    .prompt-suggestions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
    .prompt-btn { font-size: 12px; padding: 8px 15px; border-radius: 20px; background: #f4f7f6; color: #2f3e2f; border: 1px solid #e6f4ea; cursor: pointer; transition: 0.2s; white-space: nowrap; font-family: 'Zen Maru Gothic', sans-serif;}
    .prompt-btn:hover { background: #e6f4ea; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.05);}

    #aiResultArea { display: none; margin-top: 25px; border-top: 1px dashed #ddd; padding-top: 25px;}
    .ai-text { line-height: 1.8; font-size: 14.5px; color: #444; border-left: 4px solid #e6f4ea; padding-left: 15px; margin-bottom: 20px; background: #fafdfb; padding: 15px; border-radius: 0 10px 10px 0;}
    
    .filter-section { margin-bottom: 30px; }
    .search-bar { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; box-sizing: border-box; margin-bottom: 15px; font-family: 'Zen Maru Gothic', sans-serif; transition: 0.3s; outline: none;}
    .search-bar:focus { border-color: #2f3e2f; box-shadow: 0 0 8px rgba(47,62,47,0.1); }
    .tags-container { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter-tag { padding: 6px 14px; border-radius: 20px; background: #fff; border: 1px solid #ddd; font-size: 12px; cursor: pointer; transition: 0.2s; color: #555;}
    .filter-tag:hover { background: #f0f0f0; }
    .filter-tag.active { background: #2f3e2f; color: white; border-color: #2f3e2f; box-shadow: 0 4px 8px rgba(47,62,47,0.2);}
    
    .sort-options { margin-top: 20px; margin-bottom: 15px; display: flex; gap: 10px; }
    .sort-btn { padding: 8px 18px; border-radius: 20px; border: 1px solid #ddd; background: white; font-family: 'Zen Maru Gothic', sans-serif; font-size: 12px; cursor: pointer; transition: 0.2s; color: #555; font-weight: bold;}
    .sort-btn:hover { background: #f9f9f9; }
    .sort-btn.active { background: #2f3e2f; color: white; border-color: #2f3e2f; box-shadow: 0 4px 8px rgba(47,62,47,0.2);}

    /* グリッドとカード */
    .grid { display: grid; gap: 25px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    .card, .reader-card { 
      background: white; border-radius: 15px; padding: 20px 15px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; position: relative; 
      display: flex; flex-direction: column; align-items: center; 
      opacity: 0; transform: translateY(40px); 
      transition: all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    
    .card.show, .reader-card.show { opacity: 1; transform: translateY(0); }
    .card:hover, .reader-card:hover { transform: translateY(-8px); box-shadow: 0 15px 35px rgba(0,0,0,0.12); }
    
    .card::after, .reader-card::after {
      content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      border-radius: 15px; background: linear-gradient(105deg, transparent 20%, rgba(255,255,255,0.7) 25%, transparent 30%);
      background-size: 300% 300%; background-position: 150% 0;
      transition: background-position 0.7s ease-out; pointer-events: none; z-index: 10; 
    }
    .card:hover::after, .reader-card:hover::after { background-position: -50% 0; }

    .new-badge { position: absolute; top: -8px; left: -8px; background: #ff4757; color: white; font-size: 11px; font-weight: bold; padding: 4px 12px; border-radius: 12px; transform: rotate(-5deg); box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 100;}
    .rank-badge { position: absolute; top: -12px; right: -12px; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; color: white; box-shadow: 0 4px 8px rgba(0,0,0,0.2); z-index: 100; font-family: 'Zen Maru Gothic', sans-serif;}
    .rank-1 { background: linear-gradient(135deg, #ffd700, #daa520); } 
    .rank-2 { background: linear-gradient(135deg, #e0e0e0, #9e9e9e); color: #333; } 
    .rank-3 { background: linear-gradient(135deg, #cd7f32, #8b4513); } 

    .cover { width: 95px; height: 135px; object-fit: cover; border-radius: 6px; margin-bottom: 12px; box-shadow: 3px 3px 10px rgba(0,0,0,0.15); transition: 0.3s; z-index: 20;}
    .card:hover .cover { transform: scale(1.05); }

    .title { font-weight: bold; font-size: 14px; margin: 0 0 5px 0; line-height: 1.4; z-index: 20;}
    .author { font-size: 12px; color: #777; margin-bottom: 8px; z-index: 20;}
    .rating { color: #f1c40f; font-size: 13px; margin-bottom: 8px; letter-spacing: 2px; z-index: 20;}
    .card-tags { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-bottom: 15px; z-index: 20;}
    .card-tag { font-size: 10px; background: #f0f0f0; padding: 3px 8px; border-radius: 10px; color: #666; }
    
    .button-area { width: 100%; margin-top: auto; z-index: 20; position: relative;}
    .button { display: inline-block; padding: 8px 18px; background: #333; color: #fff; text-decoration: none; border-radius: 20px; font-size: 12px; transition: 0.2s; white-space: nowrap; width: 100%; box-sizing: border-box; margin-bottom: 8px; font-weight: bold;}
    .button:hover { background: #555; box-shadow: 0 4px 8px rgba(0,0,0,0.2);}
    .like-btn { width: 100%; display: inline-block; background: #fff; border: 1px solid #ff4757; color: #ff4757; border-radius: 20px; padding: 6px 15px; font-size: 12px; font-family: 'Zen Maru Gothic', sans-serif; font-weight: bold; cursor: pointer; transition: 0.2s; box-sizing: border-box;}
    .like-btn:hover { background: #ffe0e6; box-shadow: 0 4px 8px rgba(255,71,87,0.2);}
    .like-btn.liked { background: #ff4757; color: white; cursor: default; opacity: 0.9; box-shadow: none;}

    .admin-profile-section { margin-top: 60px; margin-bottom: 20px; padding: 0 10px; }
    .admin-profile-card { max-width: 700px; margin: auto; background: #fff; border-radius: 15px; padding: 25px; display: flex; align-items: center; gap: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e0f2e9; position: relative; overflow: hidden;}
    .admin-profile-card::before { content: ""; position: absolute; top: 0; left: 0; width: 6px; height: 100%; background: #4ca1af; }
    .admin-avatar { width: 85px; height: 85px; border-radius: 50%; object-fit: cover; border: 3px solid #f9fbfb; box-shadow: 0 4px 10px rgba(0,0,0,0.1);}
    .admin-info { flex: 1; text-align: left; }
    .admin-name { margin: 0 0 8px 0; font-size: 18px; color: #2f3e2f; display: flex; align-items: center; gap: 8px;}
    .admin-bio { margin: 0; font-size: 13.5px; color: #555; line-height: 1.7; }

    .reader-section { margin-top: 60px; padding: 50px 20px; background: #fffaf0; border-radius: 20px; border: 2px solid #faebd7; box-shadow: inset 0 0 20px rgba(0,0,0,0.02);}
    .reader-section h2 { text-align: center; color: #d35400; font-size: 22px; margin-top: 0; margin-bottom: 30px;}
    .reader-grid { display: grid; gap: 25px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
    .reader-card::before { content: "💬"; position: absolute; top: -15px; left: -10px; font-size: 35px; transform: rotate(-10deg); filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1)); z-index: 100;}
    .reader-quote { font-size: 14px; color: #444; line-height: 1.6; margin-bottom: 15px; background: #fdfbf7; padding: 15px; border-radius: 10px; border-left: 4px solid #ffcc80; flex-grow: 1; z-index: 20; position: relative;}
    .reader-book-title { font-weight: bold; font-size: 14px; color: #333; margin-bottom: 5px; z-index: 20; position: relative;}
    .reader-book-author { font-size: 12px; color: #777; z-index: 20; position: relative;}
    .reader-like-btn-wrap { margin-top: 15px; z-index: 20; position: relative;}

    .floating-btn { position: fixed; bottom: 25px; right: 25px; background: #ff8c00; color: white; padding: 15px 25px; border-radius: 30px; font-weight: bold; font-size: 14px; box-shadow: 0 6px 20px rgba(255, 140, 0, 0.3); cursor: pointer; transition: 0.3s; z-index: 100; border: none; font-family: 'Zen Maru Gothic', sans-serif;}
    .floating-btn:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(255, 140, 0, 0.4); }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(3px);}
    .modal-content { background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; box-shadow: 0 15px 40px rgba(0,0,0,0.2); animation: popModal 0.3s ease-out;}
    @keyframes popModal { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .modal-content h3 { margin-top: 0; margin-bottom: 15px; color: #2f3e2f; text-align: center;}
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #555; font-weight: bold;}
    .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: 'Zen Maru Gothic', sans-serif; font-size: 14px; outline: none; transition: 0.2s;}
    .form-group input:focus, .form-group textarea:focus { border-color: #2f3e2f; background: #fdfdfd;}
    .form-group textarea { height: 90px; resize: none; }
    .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 25px;}
    .cancel-btn { background: #eee; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s;}
    .cancel-btn:hover { background: #e0e0e0;}
    .submit-btn { background: #2f3e2f; color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s;}
    .submit-btn:hover { background: #4a5c4a; transform: translateY(-2px);}
    .submit-btn:disabled { background: #ccc; transform: none;}

    @media (max-width: 767px) {
      .header { padding: 50px 20px 60px; }
      /* スマホ：タイトルのフォントサイズを少し下げてボタンと被りにくくする */
      .header h1 { font-size: 28px; padding-top: 15px; }
      .grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .card { padding: 10px 5px; border-radius: 10px;}
      .cover { width: 100%; max-width: 70px; height: auto; aspect-ratio: 2 / 3; margin-bottom: 8px; box-shadow: 2px 2px 6px rgba(0,0,0,0.15);}
      .title { font-size: 10px; margin-bottom: 2px; }
      .author { font-size: 8px; margin-bottom: 4px; }
      .rating { font-size: 9px; margin-bottom: 4px; letter-spacing: 0; }
      .card-tags { margin-bottom: 8px; gap: 2px;}
      .card-tag { font-size: 7px; padding: 2px 4px; }
      .button, .like-btn { font-size: 9px; padding: 5px 6px; border-radius: 12px; width: 90%; }
      .new-badge { font-size: 8px; padding: 2px 5px; top: -4px; left: -4px; }
      .prompt-btn { font-size: 11px; padding: 6px 12px; }
      .reader-grid { grid-template-columns: 1fr; }
      .reader-card { padding: 15px; }
      .sort-options { flex-wrap: wrap; }
      .gacha-btn { font-size: 14px; padding: 12px 30px;}
      .persona-select { width: 100%; margin-bottom: 5px;}
      .floating-btn { bottom: 15px; right: 15px; padding: 12px 18px; font-size: 13px; }
      
      .admin-profile-card { flex-direction: column; text-align: center; padding: 20px; gap: 15px;}
      .admin-info { text-align: center; }
      .admin-name { justify-content: center; }
    }

    #loading { position: fixed; inset: 0; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5000; }
    .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #2f3e2f; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p style="margin-top: 15px; color: #555; font-size: 14px; font-weight:bold;">本棚を整頓中...</p>
</div>

<div id="gachaModal" class="gacha-overlay">
  <div id="gachaContent" class="gacha-content">
    <div id="gachaTitle" class="gacha-title"></div>
    <div class="gacha-slot">
      <img id="gachaSlotImg" src="https://via.placeholder.com/150/eeeeee/cccccc?text=?" alt="Slot">
    </div>
    <div id="gachaDesc" class="gacha-desc"></div>
    <div id="gachaActions" class="gacha-actions" style="display:none;">
      <button class="gacha-action-btn secondary" onclick="closeGacha()">閉じる</button>
      <button id="gachaLinkBtn" class="gacha-action-btn primary" onclick="">詳細を見る</button>
    </div>
  </div>
</div>

<button class="floating-btn" onclick="openModal()">💡 おすすめ本を教える</button>

<div id="submitModal" class="modal-overlay">
  <div class="modal-content">
    <h3>あなたのおすすめ本を教えてください</h3>
    <div class="form-group">
      <label>書籍名（必須）</label>
      <input type="text" id="submitTitle" placeholder="例：星の王子さま">
    </div>
    <div class="form-group">
      <label>著者（任意）</label>
      <input type="text" id="submitAuthor" placeholder="例：サン＝テグジュペリ">
    </div>
    <div class="form-group">
      <label>おすすめな理由・感想（必須）</label>
      <textarea id="submitReason" placeholder="例：読むたびに新しい発見があります。疲れた時におすすめです！"></textarea>
    </div>
    <div class="modal-buttons">
      <button class="cancel-btn" onclick="closeModal()">キャンセル</button>
      <button id="submitConfirmBtn" class="submit-btn" onclick="submitBook()">管理人に送る</button>
    </div>
  </div>
</div>

<div id="diagnoseModal" class="modal-overlay">
  <div class="modal-content">
    <h3>🩺 あなたの読書カルテ診断</h3>
    <p style="font-size: 13px; color: #555;">過去に読んで面白かった本や、好きな映画・アニメを3つ教えてください。AIがあなたの好みを深く分析し、最適な本を処方します。</p>
    <div class="form-group">
      <textarea id="diagnoseInput" placeholder="例：&#10;1. 千と千尋の神隠し&#10;2. 星の王子さま&#10;3. ハリーポッター" style="height: 100px;"></textarea>
    </div>
    <div class="modal-buttons">
      <button class="cancel-btn" onclick="closeDiagnoseModal()">キャンセル</button>
      <button id="diagnoseSubmitBtn" class="submit-btn" style="background: #00796b;" onclick="runDiagnose()">分析する</button>
    </div>
  </div>
</div>

<div class="header">
  <div class="header-overlay"></div>
  <div class="header-content">
    <div class="admin-tools">
      <button id="updateDbBtn" class="update-db-btn">🔄 AIに本を覚えさせる</button>
    </div>
    <h1>AI Book Shelf</h1>
    <p>あなたの気分に合わせた一冊を、私の本棚から探します</p>
  </div>
</div>

<div class="container">

  <div class="gacha-section">
    <button class="gacha-btn" onclick="playGacha()">🎲 運命の一冊ガチャを回す</button>
  </div>

  <div class="ai-section">
    <div class="ai-header">
      <strong>🤖 AIに本を相談する</strong>
      <button class="diagnose-btn" onclick="openDiagnoseModal()">🩺 あなたの読書カルテを作る</button>
    </div>
    
    <div class="ai-input-group">
      <select id="aiPersona" class="persona-select">
        <option value="normal">👓 丁寧な司書さん</option>
        <option value="hot">🔥 熱血カリスマ書店員</option>
        <option value="cat">🐱 気まぐれな猫</option>
      </select>
      <input type="text" id="aiQuery" placeholder="例：泣ける恋愛小説が読みたい、元気が出る本は？">
      <button id="aiBtn" class="ai-btn">相談する</button>
      <button id="resetBtn" class="reset-btn">リセット</button>
    </div>
    
    <div class="prompt-suggestions">
      <button class="prompt-btn" onclick="setAiPrompt('☕ 休日にのんびり読めるエッセイ')">☕ 休日にのんびり</button>
      <button class="prompt-btn" onclick="setAiPrompt('😭 思いっきり泣ける切ない恋愛小説')">😭 思いっきり泣きたい</button>
      <button class="prompt-btn" onclick="setAiPrompt('🌙 寝る前にサクッと読める短編')">🌙 寝る前にサクッと</button>
      <button class="prompt-btn" onclick="setAiPrompt('🚀 明日からの活力が湧いてくる本')">🚀 活力が湧いてくる</button>
      <button class="prompt-btn" onclick="setAiPrompt('🕵️‍♂️ ページをめくる手が止まらないミステリー')">🕵️‍♂️ ドキドキしたい</button>
    </div>
    
    <div id="aiResultArea">
      <div id="aiText" class="ai-text"></div>
      <div id="aiBooksGrid" class="grid"></div>
    </div>
  </div>

  <div class="filter-section">
    <input type="text" id="searchBar" class="search-bar" placeholder="本のタイトルや著者名で検索...">
    <div id="tagsContainer" class="tags-container"></div>
    
    <div class="sort-options">
      <button id="sortNewBtn" class="sort-btn active" onclick="changeSortMode('new')">📅 新着順</button>
      <button id="sortLikeBtn" class="sort-btn" onclick="changeSortMode('like')">❤️ 人気順（いいね）</button>
    </div>
  </div>

  <div id="grid" class="grid"></div>

  <!-- 🔴追加：管理人のプロフィールセクション -->
  <div class="admin-profile-section">
    <div class="admin-profile-card">
      <img src="ChatGPT Image 2026年5月6日 19_04_17.png" alt="管理人" class="admin-avatar">
      <div class="admin-info">
        <h3 class="admin-name">💼 管理人：s h o t a</h3>
        <p class="admin-bio">
          恋愛小説、海外文学、エッセイを中心に、日々さまざまな物語を読んでいます。<br>
          年末に「その年のベスト5」を選ぶのが密かな楽しみです！<br>
          この本棚が、あなたの新しい一冊との出会いの場になれば嬉しいです。
        </p>
      </div>
    </div>
  </div>

  <div class="reader-section">
    <h2>👑 みんなのおすすめ人気ランキング</h2>
    <div id="readerGrid" class="reader-grid">
      <!-- 読者の投稿（ランキング順） -->
    </div>
  </div>

</div>

<script>
  // 🔴 ここをご自身のGASのWebアプリURLに書き換えてください
  const API_URL = "https://script.google.com/macros/s/AKfycbxnivqaTxApYmc8wWPn8BUk5p_caL2n6dPAjau7_8xkva7rLCODuY8idJJe0GJ-dyrw/exec"; 
  
  let allData = [];
  let readerData = []; 
  let gachaPool = []; 
  let activeTags = []; 
  let currentSortMode = 'new'; 

  let likedBooks = JSON.parse(localStorage.getItem('likedBooks')) || [];

  window.onload = async () => {
    try {
      const res = await fetch(API_URL);
      const data = await res.json();
      allData = data.books;
      readerData = data.readerBooks || [];
      
      allData.sort((a, b) => new Date(b.updated) - new Date(a.updated));
      generateFilterTags(allData);
      filterBooks(); 
      renderReaderGrid(readerData);
      
      gachaPool = [
        ...allData.map(b => ({ ...b, type: 'admin' })),
        ...readerData.map(b => ({ ...b, type: 'reader', image: 'https://via.placeholder.com/150/ffebd6/ff8c00?text=Reader+Book' }))
      ];

      document.getElementById("loading").style.display = "none";
      
      observeCards();
    } catch (e) {
      console.error("読み込みエラー:", e);
      alert("データの取得に失敗しました。GASの公開設定を確認してください。");
    }
  };

  function observeCards() {
    const cards = document.querySelectorAll('.card:not(.show), .reader-card:not(.show)');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          setTimeout(() => { entry.target.classList.add('show'); }, 50); 
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
    cards.forEach(card => observer.observe(card));
  }

  function playGacha() {
    if (gachaPool.length === 0) return alert("まだ本棚に本がありません！");
    const modal = document.getElementById('gachaModal');
    const content = document.getElementById('gachaContent');
    const titleEl = document.getElementById('gachaTitle');
    const slotImg = document.getElementById('gachaSlotImg');
    const descEl = document.getElementById('gachaDesc');
    const actions = document.getElementById('gachaActions');

    modal.style.display = 'flex';
    content.classList.remove('result-mode');
    slotImg.classList.remove('flash-anim');
    actions.style.display = 'none';
    
    titleEl.innerHTML = "運命の本を探しています...<br><span style='color:#ff8c00;'>🎲 カラカラカラ...</span>";
    descEl.innerHTML = "";

    let counter = 0;
    const slotInterval = setInterval(() => {
      const randomBook = gachaPool[Math.floor(Math.random() * gachaPool.length)];
      slotImg.src = randomBook.image;
      counter++;
      if (counter > 25) { clearInterval(slotInterval); showGachaWinner(); }
    }, 100);
  }

  function showGachaWinner() {
    const winner = gachaPool[Math.floor(Math.random() * gachaPool.length)];
    const content = document.getElementById('gachaContent');
    const slotImg = document.getElementById('gachaSlotImg');
    const titleEl = document.getElementById('gachaTitle');
    const descEl = document.getElementById('gachaDesc');
    const actions = document.getElementById('gachaActions');
    const linkBtn = document.getElementById('gachaLinkBtn');

    slotImg.src = winner.image;
    slotImg.classList.add('flash-anim');
    content.classList.add('result-mode'); 

    titleEl.innerHTML = "✨ 運命の一冊はコレだ！ ✨<br><span style='color:#d35400; font-size:22px; line-height:1.2; display:block; margin-top:10px;'>" + winner.title + "</span>";
    let sourceText = winner.type === 'admin' ? "👑 管理人の本棚より" : "💬 読者のおすすめより";
    let authorText = winner.author ? `著：${winner.author}` : "";
    descEl.innerHTML = `<strong style="color:#2f3e2f;">${sourceText}</strong><br>${authorText}`;

    if (winner.type === 'admin' && winner.url !== "#") {
      linkBtn.onclick = () => window.open(winner.url, '_blank');
      linkBtn.style.display = 'block';
    } else { linkBtn.style.display = 'none'; }
    actions.style.display = 'flex';
  }

  function closeGacha() { document.getElementById('gachaModal').style.display = 'none'; }

  function changeSortMode(mode) {
    currentSortMode = mode;
    document.getElementById("sortNewBtn").classList.remove("active");
    document.getElementById("sortLikeBtn").classList.remove("active");
    if(mode === 'new') document.getElementById("sortNewBtn").classList.add("active");
    if(mode === 'like') document.getElementById("sortLikeBtn").classList.add("active");
    filterBooks(); 
  }

  function generateFilterTags(books) {
    const container = document.getElementById("tagsContainer");
    const uniqueTags = new Set();
    books.forEach(book => book.tags.forEach(tag => uniqueTags.add(tag)));
    uniqueTags.forEach(tag => {
      const btn = document.createElement("button");
      btn.className = "filter-tag";
      btn.textContent = tag;
      btn.onclick = () => {
        btn.classList.toggle("active"); 
        if (activeTags.includes(tag)) activeTags = activeTags.filter(t => t !== tag);
        else activeTags.push(tag);
        filterBooks(); 
      };
      container.appendChild(btn);
    });
  }

  document.getElementById("searchBar").addEventListener("input", filterBooks);

  function filterBooks() {
    const searchText = document.getElementById("searchBar").value.toLowerCase();
    let filtered = allData.filter(book => {
      const matchText = (book.title + book.author).toLowerCase().includes(searchText);
      const matchTags = activeTags.every(activeTag => book.tags.includes(activeTag));
      return matchText && matchTags;
    });
    if (currentSortMode === 'new') filtered.sort((a, b) => new Date(b.updated) - new Date(a.updated));
    else if (currentSortMode === 'like') filtered.sort((a, b) => b.likes - a.likes);
    renderMainGrid(filtered);
  }

  function generateCardHTML(book, index = -1) {
    const now = new Date();
    const diffDays = (now - new Date(book.updated)) / (1000 * 60 * 60 * 24); 
    const newBadgeHtml = diffDays <= 7 ? `<div class="new-badge">New!</div>` : '';

    let ratingDisplay = book.rating;
    if (!isNaN(book.rating) && book.rating !== "") {
        const stars = Math.min(Math.max(parseInt(book.rating), 0), 5); 
        ratingDisplay = "★".repeat(stars) + "☆".repeat(5 - stars);
    }
    const ratingHtml = ratingDisplay ? `<div class="rating">${ratingDisplay}</div>` : '';
    const tagsHtml = `<div class="card-tags">${book.tags.map(t => `<span class="card-tag">${t}</span>`).join("")}</div>`;

    const isLiked = likedBooks.includes(book.id);
    const btnClass = isLiked ? "like-btn liked" : "like-btn";
    const btnDisabled = isLiked ? "disabled" : "";

    let badgeHtml = "";
    if (currentSortMode === 'like' && index >= 0 && index <= 2 && book.likes > 0) {
      if (index === 0) badgeHtml = `<div class="rank-badge rank-1">👑 1位</div>`;
      else if (index === 1) badgeHtml = `<div class="rank-badge rank-2">🥈 2位</div>`;
      else if (index === 2) badgeHtml = `<div class="rank-badge rank-3">🥉 3位</div>`;
    }

    return `
      <div class="card">
        ${newBadgeHtml}
        ${badgeHtml}
        <img src="${book.image}" class="cover" onerror="this.src='https://via.placeholder.com/80x130?text=No+Image'">
        <div class="title">${book.title}</div>
        <div class="author">${book.author}</div>
        ${ratingHtml}
        ${tagsHtml}
        <div class="button-area">
          <a href="${book.url}" target="_blank" class="button">感想を見る</a>
          <button id="likeBtn-${book.id}" class="${btnClass}" onclick="likeBook('${book.id}', ${book.likes})" ${btnDisabled}>
            ❤️ 読みたい！ (${book.likes})
          </button>
        </div>
      </div>
    `;
  }

  function renderMainGrid(books) { 
    document.getElementById("grid").innerHTML = books.map((book, index) => generateCardHTML(book, index)).join(""); 
    setTimeout(observeCards, 100);
  }

  function renderReaderGrid(books) {
    const grid = document.getElementById("readerGrid");
    if (books.length === 0) { grid.innerHTML = `<p style="text-align: center; color: #888; grid-column: 1 / -1; margin: 20px 0;">まだおすすめの投稿はありません。<br>右下のボタンから、あなたのお気に入りの一冊を教えてください！</p>`; return; }
    const sortedBooks = [...books].sort((a, b) => b.likes - a.likes);
    grid.innerHTML = sortedBooks.map((book, index) => {
      const isLiked = likedBooks.includes(book.id);
      const btnClass = isLiked ? "like-btn liked" : "like-btn";
      const btnDisabled = isLiked ? "disabled" : "";
      let badgeHtml = "";
      if (book.likes > 0) {
        if (index === 0) badgeHtml = `<div class="rank-badge rank-1">👑 1位</div>`;
        else if (index === 1) badgeHtml = `<div class="rank-badge rank-2">🥈 2位</div>`;
        else if (index === 2) badgeHtml = `<div class="rank-badge rank-3">🥉 3位</div>`;
      }
      return `
      <div class="reader-card">
        ${badgeHtml}
        <div class="reader-quote">${book.reason.replace(/\n/g, '<br>')}</div>
        <div class="reader-book-title">📖 ${book.title}</div>
        <div class="reader-book-author">✍️ ${book.author}</div>
        <div class="reader-like-btn-wrap">
          <button id="likeBtn-${book.id}" class="${btnClass}" onclick="likeBook('${book.id}', ${book.likes})" ${btnDisabled}>❤️ 読みたい！ (${book.likes})</button>
        </div>
      </div>
    `}).join("");
    setTimeout(observeCards, 100);
  }

  function likeBook(pageId, currentLikes) {
    const btn = document.getElementById(`likeBtn-${pageId}`);
    btn.textContent = `❤️ 読みたい！ (${currentLikes + 1})`;
    btn.classList.add("liked"); btn.disabled = true;
    likedBooks.push(pageId); localStorage.setItem('likedBooks', JSON.stringify(likedBooks));
    fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "likeBook", pageId: pageId }) }).catch(e => console.error("いいねの送信に失敗しました", e));
  }

  function setAiPrompt(promptText) { document.getElementById("aiQuery").value = promptText; document.getElementById("aiBtn").click(); }

  document.getElementById("aiBtn").onclick = async () => {
    const query = document.getElementById("aiQuery").value;
    if (!query) return;

    const persona = document.getElementById("aiPersona").value; 
    const btn = document.getElementById("aiBtn");
    const resultArea = document.getElementById("aiResultArea");
    const aiText = document.getElementById("aiText");
    const aiBooksGrid = document.getElementById("aiBooksGrid");
    const resetBtn = document.getElementById("resetBtn");

    btn.disabled = true; btn.textContent = "考え中...";
    resultArea.style.display = "block";
    aiText.innerHTML = "本棚から探しています。少々お待ちください...";
    aiBooksGrid.innerHTML = ""; resetBtn.style.display = "none";

    try {
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ message: query, persona: persona }) });
      const data = await res.json();
      aiText.innerHTML = data.result.replace(/\n/g, "<br>");
      
      if (data.recommendedBooks && data.recommendedBooks.length > 0) {
        const freshBooks = [...allData, ...readerData];
        const updatedRecommendedBooks = data.recommendedBooks.map(aiBook => {
          const freshBook = freshBooks.find(b => b.id === aiBook.id);
          return freshBook ? freshBook : aiBook;
        });
        
        aiBooksGrid.innerHTML = updatedRecommendedBooks.map(book => generateCardHTML(book, -1)).join("");
        setTimeout(observeCards, 100); 
      }
      resetBtn.style.display = "inline-block";
    } catch (e) { aiText.innerHTML = "エラーが起きました。もう一度試してください。"; } 
    finally { btn.disabled = false; btn.textContent = "相談する"; }
  };

  document.getElementById("resetBtn").onclick = () => {
    document.getElementById("aiQuery").value = ""; 
    document.getElementById("aiResultArea").style.display = "none"; 
    document.getElementById("resetBtn").style.display = "none"; 
  };

  document.getElementById("updateDbBtn").onclick = async () => {
    const pass = prompt("新しい本をAIに覚えさせるための「合言葉」を入力してください。");
    if (!pass) return; 
    const btn = document.getElementById("updateDbBtn");
    btn.textContent = "処理中（1〜2分かかります）..."; btn.disabled = true;
    try {
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "updateDB", password: pass }) });
      const data = await res.json();
      if (data.status === "success") { alert("AIが新しい本を覚えました！\nページをリロードして反映します。"); location.reload(); } 
      else { alert("エラー: " + data.message); }
    } catch (e) { alert("通信エラーが発生しました。"); } 
    finally { btn.textContent = "🔄 AIに本を覚えさせる"; btn.disabled = false; }
  };

  function openModal() { document.getElementById("submitModal").style.display = "flex"; }
  function closeModal() { document.getElementById("submitModal").style.display = "none"; }

  async function submitBook() {
    const title = document.getElementById("submitTitle").value.trim();
    const author = document.getElementById("submitAuthor").value.trim();
    const reason = document.getElementById("submitReason").value.trim();
    if (!title || !reason) { alert("「書籍名」と「おすすめな理由」は必須です！"); return; }

    const btn = document.getElementById("submitConfirmBtn");
    btn.textContent = "送信中..."; btn.disabled = true;

    try {
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "submitBook", data: { title: title, author: author, reason: reason } }) });
      const data = await res.json();
      if (data.status === "success") {
        alert("おすすめ本を送信しました！ありがとうございます。");
        closeModal();
        document.getElementById("submitTitle").value = ""; document.getElementById("submitAuthor").value = ""; document.getElementById("submitReason").value = "";
      } else { alert("エラーが発生しました: " + data.message); }
    } catch (e) { alert("通信エラーが発生しました。"); } 
    finally { btn.textContent = "管理人に送る"; btn.disabled = false; }
  }

  function openDiagnoseModal() { document.getElementById("diagnoseModal").style.display = "flex"; }
  function closeDiagnoseModal() { document.getElementById("diagnoseModal").style.display = "none"; }

  async function runDiagnose() {
    const input = document.getElementById("diagnoseInput").value.trim();
    if (!input) return alert("好きな作品を教えてください！");

    const btn = document.getElementById("diagnoseSubmitBtn");
    btn.textContent = "分析中..."; btn.disabled = true;

    closeDiagnoseModal();
    const resultArea = document.getElementById("aiResultArea");
    const aiText = document.getElementById("aiText");
    const aiBooksGrid = document.getElementById("aiBooksGrid");
    const resetBtn = document.getElementById("resetBtn");
    
    resultArea.style.display = "block";
    aiText.innerHTML = "あなたの好みを分析しています。少々お待ちください...<br><span style='font-size:12px;color:#888;'>(プロの書評家AIがカルテを作成中です)</span>";
    aiBooksGrid.innerHTML = "";
    resetBtn.style.display = "none";

    try {
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "diagnose", message: input }) });
      const data = await res.json();
      
      aiText.innerHTML = "<h4 style='margin-top:0; color:#00796b;'>🩺 あなたの読書カルテ</h4>" + data.result.replace(/\n/g, "<br>");
      if (data.recommendedBooks && data.recommendedBooks.length > 0) {
        const freshBooks = [...allData, ...readerData];
        const updatedRecommendedBooks = data.recommendedBooks.map(aiBook => {
          const freshBook = freshBooks.find(b => b.id === aiBook.id);
          return freshBook ? freshBook : aiBook;
        });
        
        aiBooksGrid.innerHTML = updatedRecommendedBooks.map(book => generateCardHTML(book, -1)).join("");
        setTimeout(observeCards, 100);
      }
      resetBtn.style.display = "inline-block";
    } catch (e) {
      aiText.innerHTML = "エラーが起きました。もう一度試してください。";
    } finally {
      btn.textContent = "分析する"; btn.disabled = false;
      document.getElementById("diagnoseInput").value = ""; 
    }
  }

</script>
</body>
</html>
