<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Book Shelf</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* 共通設定 */
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: 'Zen Maru Gothic', sans-serif; background: #f9fbfb; color: #333; }
    
    /* ヘッダー背景 */
    .header { text-align: center; padding: 60px 20px 80px; position: relative; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; background: linear-gradient(-45deg, #2c3e50, #000000, #4ca1af, #2c3e50); background-size: 400% 400%; animation: gradientBG 15s ease infinite;}
    @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    
    .header-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.2); z-index: 1; }
    .header-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; }
    .header h1 { font-size: 34px; margin: 0 0 15px 0; text-shadow: 0 2px 10px rgba(0,0,0,0.5); letter-spacing: 2px;}

    /* ナビゲーションボタン */
    .nav-links { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 25px; }
    .nav-btn { background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255,255,255,0.4); color: white; padding: 8px 18px; border-radius: 20px; font-size: 11px; font-weight: bold; cursor: pointer; backdrop-filter: blur(5px); transition: 0.3s; text-decoration: none;}
    .nav-btn:hover { background: white; color: #2c3e50; transform: translateY(-2px); }

    /* 管理者ボタン（右上） */
    .admin-tools { position: absolute; top: 10px; right: 10px; z-index: 100;}
    .update-db-btn { font-size: 10px; padding: 5px 12px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; cursor: pointer; color: white; transition: 0.3s; backdrop-filter: blur(4px); font-family: inherit;}

    /* AIの空気感 */
    .shelf-mood { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(5px); display: inline-block; padding: 8px 20px; border-radius: 30px; font-size: 13px; border: 1px solid rgba(255,255,255,0.3); max-width: 85%; }
    
    .container { max-width: 900px; margin: auto; padding: 20px; }

    /* ガチャセクション */
    .gacha-section { text-align: center; margin-top: -45px; margin-bottom: 45px; position: relative; z-index: 90; }
    .gacha-btn { background: linear-gradient(45deg, #ff6b6b, #ff8e53); color: white; font-size: 16px; font-weight: bold; padding: 15px 40px; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4); transition: transform 0.2s, box-shadow 0.2s; animation: pulseGacha 2s infinite; font-family: 'Zen Maru Gothic', sans-serif; letter-spacing: 1px;}

    /* AI相談セクション */
    .ai-section { background: #fff; border: 1px solid #e0f2e9; padding: 25px; border-radius: 20px; margin-bottom: 40px; box-shadow: 0 8px 25px rgba(0,0,0,0.04); }
    .ai-top-row { display: flex; align-items: flex-end; gap: 20px; margin-bottom: 20px; }
    .ai-avatar-circle { width: 75px; height: 70px; border-radius: 50%; border: 3px solid #e0f2e9; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.1); background: #eee; transition: opacity 0.3s ease; }
    .ai-header { flex: 1; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;}
    .diagnose-btn { background: #e0f7fa; color: #00796b; border: 1px solid #b2ebf2; padding: 8px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; font-family: inherit;}

    .ai-input-group { display: flex; gap: 10px; flex-wrap: wrap;}
    .persona-select { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff; cursor: pointer;}
    input[type="text"] { flex: 1; min-width: 200px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; outline: none;}
    .ai-btn { background: #2f3e2f; color: white; border: none; padding: 10px 25px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: bold;}
    .reset-btn { background: #fff; color: #2f3e2f; border: 1px solid #2f3e2f; padding: 10px 20px; border-radius: 8px; cursor: pointer; display: none; font-weight: bold;}

    .prompt-suggestions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
    .prompt-btn { font-size: 11px; padding: 8px 15px; border-radius: 20px; background: #f4f7f6; color: #2f3e2f; border: 1px solid #e6f4ea; cursor: pointer; transition: 0.2s; font-family: inherit;}

    #aiResultArea { display: none; margin-top: 25px; border-top: 1px dashed #ddd; padding-top: 25px;}
    .ai-text { line-height: 1.8; font-size: 14.5px; color: #444; border-left: 4px solid #e6f4ea; padding: 15px; background: #fafdfb; border-radius: 0 10px 10px 0;}
    
    /* フィルター・ソート */
    .filter-section { margin-bottom: 30px; }
    .search-bar { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; box-sizing: border-box; margin-bottom: 15px; font-family: inherit; outline: none;}
    .tags-container { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter-tag { padding: 6px 14px; border-radius: 20px; background: #fff; border: 1px solid #ddd; font-size: 12px; cursor: pointer; transition: 0.2s; color: #555;}
    .filter-tag.active { background: #2f3e2f; color: white; border-color: #2f3e2f; }
    
    .sort-options { margin-top: 20px; margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
    .sort-btn { padding: 8px 18px; border-radius: 20px; border: 1px solid #ddd; background: white; font-family: inherit; font-size: 12px; cursor: pointer; transition: 0.2s; font-weight: bold;}
    .sort-btn.active { background: #2f3e2f; color: white; border-color: #2f3e2f; }
    .my-shelf-btn { background: #fff5e6; color: #d35400; border: 1px solid #ffcc80; }
    .my-shelf-btn.active { background: #d35400; color: white; }

    /* グリッド */
    .grid { display: grid; gap: 25px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); margin-bottom: 60px;}
    .card, .reader-card { background: white; border-radius: 15px; padding: 20px 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; position: relative; display: flex; flex-direction: column; align-items: center; opacity: 0; transform: translateY(40px); transition: all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1); }
    .card.show, .reader-card.show { opacity: 1; transform: translateY(0); }
    .card:hover, .reader-card:hover { transform: translateY(-8px); box-shadow: 0 15px 35px rgba(0,0,0,0.12); }
    
    .new-badge { position: absolute; top: -8px; left: -8px; background: #ff4757; color: white; font-size: 11px; font-weight: bold; padding: 4px 12px; border-radius: 12px; transform: rotate(-5deg); z-index: 100;}
    .rank-badge { position: absolute; top: -12px; right: -12px; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; color: white; box-shadow: 0 4px 8px rgba(0,0,0,0.2); z-index: 100;}
    .rank-1 { background: linear-gradient(135deg, #ffd700, #daa520); } 
    .rank-2 { background: linear-gradient(135deg, #e0e0e0, #9e9e9e); color: #333; } 
    .rank-3 { background: linear-gradient(135deg, #cd7f32, #8b4513); } 

    .cover { width: 95px; height: 135px; object-fit: cover; border-radius: 6px; margin-bottom: 12px; box-shadow: 3px 3px 10px rgba(0,0,0,0.15);}
    .title { font-weight: bold; font-size: 14px; margin: 0 0 5px 0; line-height: 1.4; }
    .author { font-size: 12px; color: #777; margin-bottom: 8px; }
    .rating { color: #f1c40f; font-size: 13px; margin-bottom: 8px; letter-spacing: 2px; }
    .card-tags { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-bottom: 15px;}
    .card-tag { font-size: 10px; background: #f0f0f0; padding: 3px 8px; border-radius: 10px; color: #666; }
    
    .button-area { width: 100%; margin-top: auto; z-index: 20; display: flex; flex-direction: column; gap: 6px;}
    .primary-buttons { display: flex; gap: 5px; }
    .button { flex: 1; padding: 10px 5px; background: #333; color: #fff; text-decoration: none; border-radius: 15px; font-size: 10px; transition: 0.2s; font-weight: bold; text-align: center; border: none; cursor: pointer; font-family: inherit;}
    .button.ai-summary-btn { background: #e0f2f1; color: #00695c; border: 1px solid #b2dfdb;}
    
    .action-row { display: flex; gap: 5px; width: 100%; }
    .action-row button { 
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; padding: 6px 2px; border-radius: 12px; font-size: 8px; border: 1px solid #eee; 
      background: #fdfdfd; cursor: pointer; font-family: inherit; font-weight: bold; transition: 0.2s; color: #666;
    }
    .action-row button span { font-size: 12px; }

    .like-btn.liked { background: #fff1f2; color: #ff4757; border-color: #ff4757; }
    .read-btn.read { background: #f0f9fa; color: #4ca1af; border-color: #4ca1af; }
    .save-btn.saved { background: #fff7ed; color: #d35400; border-color: #d35400; }

    /* 処方箋セクション */
    .prescription-section { background: #fff; border-radius: 20px; padding: 40px 30px; margin-bottom: 60px; border: 1px solid #e1f5fe; box-shadow: 0 10px 30px rgba(1, 87, 155, 0.05); scroll-margin-top: 20px; }
    .prescription-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; justify-content: center;}
    .prescription-title { font-size: 22px; font-weight: bold; color: #01579b; margin: 0; }
    .prescription-input-group { display: flex; gap: 10px; margin: 20px auto 0; max-width: 600px; }
    .prescribe-btn { background: #01579b; color: white; border: none; padding: 12px 30px; border-radius: 30px; cursor: pointer; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 15px rgba(1, 87, 155, 0.2); white-space: nowrap;}
    
    #prescriptionResultArea { display: none; margin-top: 30px; animation: fadeIn 0.5s ease; }
    .prescription-card { background: #f1f8ff; border: 2px dashed #0288d1; border-radius: 15px; padding: 25px; position: relative; margin: auto; max-width: 600px;}
    .prescription-book-box { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; background: white; padding: 15px; border-radius: 10px;}
    
    /* 管理人プロフィール */
    .admin-profile-section { margin-bottom: 60px; padding: 0 10px; scroll-margin-top: 20px; }
    .admin-profile-card { max-width: 700px; margin: auto; background: #fff; border-radius: 15px; padding: 30px; display: flex; align-items: center; gap: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e0f2e9; position: relative; overflow: hidden;}
    .admin-profile-card::before { content: ""; position: absolute; top: 0; left: 0; width: 6px; height: 100%; background: #4ca1af; }
    .admin-avatar { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid #f9fbfb; box-shadow: 0 4px 10px rgba(0,0,0,0.1);}
    .admin-info { flex: 1; text-align: left; }
    .admin-name { margin: 0 0 8px 0; font-size: 20px; color: #2f3e2f; display: flex; align-items: center; gap: 8px;}
    .admin-bio { margin: 0; font-size: 14px; color: #555; line-height: 1.8; }

    /* 読者コーナー */
    .reader-section { padding: 60px 20px; background: #fffaf0; border-radius: 20px; border: 2px solid #faebd7; scroll-margin-top: 20px; margin-bottom: 40px;}
    .reader-section h2 { text-align: center; color: #d35400; font-size: 24px; margin-top: 0; margin-bottom: 35px;}
    .reader-grid { display: grid; gap: 25px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
    .reader-card::before { content: "💬"; position: absolute; top: -15px; left: -10px; font-size: 35px; transform: rotate(-10deg); filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1)); z-index: 100;}

    /* 🔴光り輝くおすすめボタン（パルスエフェクト） */
    .floating-btn {
      position: fixed; bottom: 25px; right: 25px;
      background: linear-gradient(135deg, #ff8c00, #ff6b6b); color: white;
      padding: 16px 28px; border-radius: 50px; border: none;
      font-weight: bold; font-family: 'Zen Maru Gothic'; cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 140, 0, 0.4);
      z-index: 1000; transition: all 0.3s ease;
      animation: buttonPulse 2.5s infinite;
    }
    .floating-btn:hover { transform: scale(1.1) rotate(-2deg); box-shadow: 0 15px 35px rgba(255, 140, 0, 0.6); }

    @keyframes buttonPulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 140, 0, 0.7); }
      70% { box-shadow: 0 0 0 20px rgba(255, 140, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 140, 0, 0); }
    }

    /* モーダル */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(3px);}
    .modal-content { background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 450px; box-shadow: 0 15px 40px rgba(0,0,0,0.2); animation: popModal 0.3s ease-out;}
    @keyframes popModal { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    #loading { position: fixed; inset: 0; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5000; }
    .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #2f3e2f; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 767px) {
      .header h1 { font-size: 24px; padding-top: 15px; }
      .admin-tools { right: 5px; top: 5px; }
      .update-db-btn { font-size: 8px; padding: 4px 8px; }
      .nav-links { gap: 6px; }
      .nav-btn { font-size: 9px; padding: 6px 12px; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .card { padding: 12px 8px; }
      .floating-btn { bottom: 20px; right: 20px; padding: 12px 20px; font-size: 13px; }
    }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p style="margin-top: 15px; font-size: 14px; font-weight:bold;">本棚を整頓中...</p>
</div>

<!-- ガチャ演出 -->
<div id="gachaModal" class="modal-overlay">
  <div class="modal-content">
    <div id="gachaTitle" style="font-size: 18px; font-weight: bold; margin-bottom: 15px; min-height: 50px; text-align: center;"></div>
    <div style="width: 140px; height: 200px; margin: 20px auto; border-radius: 10px; overflow: hidden; background:#eee; box-shadow: 0 10px 20px rgba(0,0,0,0.1);">
      <img id="gachaSlotImg" src="" style="width: 100%; height: 100%; object-fit: cover;">
    </div>
    <div id="gachaDesc" style="font-size: 14px; color: #555; margin-bottom: 25px; min-height: 40px; text-align: center;"></div>
    <div id="gachaActions" style="display:none; gap: 10px; justify-content: center;">
      <button onclick="closeGacha()" style="padding: 10px 20px; border-radius: 20px; border: none; background: #eee; cursor: pointer; font-family: inherit;">閉じる</button>
      <button id="gachaLinkBtn" style="padding: 10px 20px; border-radius: 20px; border: none; background: #ff8c00; color: white; cursor: pointer; font-family: inherit;">詳細を見る</button>
    </div>
  </div>
</div>

<!-- モーダル各種 -->
<div id="submitModal" class="modal-overlay">
  <div class="modal-content">
    <h3>おすすめ本を教えてください</h3>
    <input type="text" id="submitTitle" placeholder="書籍名（必須）" style="width:100%; padding:12px; margin-bottom:15px; border:1px solid #ddd; border-radius:8px; box-sizing:border-box;">
    <input type="text" id="submitAuthor" placeholder="著者（任意）" style="width:100%; padding:12px; margin-bottom:15px; border:1px solid #ddd; border-radius:8px; box-sizing:border-box;">
    <textarea id="submitReason" placeholder="おすすめ理由（必須）" style="width:100%; height:100px; padding:12px; border:1px solid #ddd; border-radius:8px; box-sizing:border-box; resize:none;"></textarea>
    <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
      <button onclick="closeModal()" style="padding:10px 20px; border:none; border-radius:8px; background:#eee; cursor:pointer;">キャンセル</button>
      <button id="submitConfirmBtn" onclick="submitBook()" style="padding:10px 20px; border:none; border-radius:8px; background:#2f3e2f; color:white; cursor:pointer;">管理人に送る</button>
    </div>
  </div>
</div>

<div id="diagnoseModal" class="modal-overlay">
  <div class="modal-content">
    <h3>🩺 読書カルテ診断</h3>
    <p style="font-size:13px; color:#555;">作品を3つ教えてください。AIが好みを分析します。</p>
    <textarea id="diagnoseInput" placeholder="1. 作品名A&#10;2. 作品名B&#10;3. 作品名C" style="width:100%; height:120px; padding:12px; border:1px solid #ddd; border-radius:8px; box-sizing:border-box; resize:none; font-family:inherit;"></textarea>
    <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
      <button onclick="closeDiagnoseModal()" style="padding:10px 20px; border:none; border-radius:8px; background:#eee; cursor:pointer;">キャンセル</button>
      <button onclick="runDiagnose()" style="padding:10px 20px; border:none; border-radius:8px; background:#00796b; color:white; cursor:pointer;">分析する</button>
    </div>
  </div>
</div>

<div id="summaryModal" class="modal-overlay">
  <div class="modal-content" style="max-width: 480px;">
    <h3 id="summaryBookTitle" style="margin: 0 0 15px; color:#00695c; font-size:18px;"></h3>
    <div id="summaryText" style="line-height:1.8; font-size:14px; background:#f9f9f9; padding:20px; border-radius:15px; border-left:5px solid #00695c;">AI司書が読み込み中...</div>
    <div style="text-align: right; margin-top: 25px;">
      <button onclick="closeSummaryModal()" style="padding:10px 25px; border:none; border-radius:8px; background:#eee; cursor:pointer;">閉じる</button>
    </div>
  </div>
</div>

<!-- ヘッダー -->
<div class="header">
  <div class="header-overlay"></div>
  <div class="admin-tools">
    <button id="updateDbBtn" class="update-db-btn">🔄 AIに本を覚えさせる</button>
  </div>
  <div class="header-content">
    <h1>AI Book Shelf</h1>
    <div class="nav-links">
      <a href="#adminProfile" class="nav-btn">💼 管理人プロフィール</a>
      <a href="#prescriptionSection" class="nav-btn">💊 本の処方箋をもらう</a>
      <a href="#readerSection" class="nav-btn">👑 みんなのおすすめ本</a>
    </div>
    <div id="shelfMood" class="shelf-mood">本棚を読み込み中...</div>
  </div>
</div>

<div class="container">

  <!-- ガチャ -->
  <div class="gacha-section">
    <button class="gacha-btn" onclick="playGacha()">🎲 運命の一冊ガチャを回す</button>
  </div>

  <!-- AI相談セクション -->
  <div class="ai-section">
    <div class="ai-top-row">
      <img id="aiChatAvatar" class="ai-avatar-circle" src="" alt="AI Avatar">
      <div class="ai-header">
        <strong>🤖 AIに本を相談する</strong>
        <button class="diagnose-btn" onclick="openDiagnoseModal()">🩺 読書カルテ診断を作る</button>
      </div>
    </div>
    <div class="ai-input-group">
      <select id="aiPersona" class="persona-select" onchange="updateChatAvatar('normal')">
        <option value="normal">👓 丁寧な司書さん</option>
        <option value="hot">🔥 熱血カリスマ書店員</option>
        <option value="cat">🐱 気まぐれな猫</option>
      </select>
      <input type="text" id="aiQuery" placeholder="今の気分や、読みたい本を教えてください...">
      <button id="aiBtn" class="ai-btn" onclick="runAiConsult()">相談する</button>
    </div>
    <div class="prompt-suggestions">
      <button class="prompt-btn" onclick="setAiPrompt('☕ 休日にのんびり読めるエッセイ')">☕ のんびり</button>
      <button class="prompt-btn" onclick="setAiPrompt('😭 思いっきり泣ける恋愛小説')">😭 泣きたい</button>
      <button class="prompt-btn" onclick="setAiPrompt('🚀 明日からの活力が湧いてくる本')">🚀 元気がほしい</button>
    </div>
    <div id="aiResultArea">
      <div id="aiText" class="ai-text"></div>
      <div id="aiBooksGrid" class="grid" style="margin-top:20px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap:15px;"></div>
      <button id="resetBtn" class="reset-btn" onclick="resetAi()" style="margin-top:15px;">リセット</button>
    </div>
  </div>

  <!-- フィルター・ソート -->
  <div class="filter-section">
    <input type="text" id="searchBar" class="search-bar" placeholder="タイトル、著者で検索..." oninput="renderAll()">
    <div id="tagsContainer" class="tags-container"></div>
    <div class="sort-options">
      <button id="sortNewBtn" class="sort-btn active" onclick="changeSortMode('new')">📅 新着順</button>
      <button id="sortLikeBtn" class="sort-btn" onclick="changeSortMode('like')">❤️ 人気順</button>
      <button id="myShelfBtn" class="sort-btn my-shelf-btn" onclick="toggleMyShelf()">🔖 あとで読む本棚</button>
    </div>
  </div>

  <div id="grid" class="grid"></div>

  <!-- 処方箋セクション -->
  <div id="prescriptionSection" class="prescription-section">
    <div class="prescription-header">
      <img id="pharmacistAvatar" class="ai-avatar-circle" src="" alt="Pharmacist">
      <div class="prescription-title">💊 AI本の処方箋（お悩み相談室）</div>
    </div>
    <p style="text-align:center; font-size:13px; color:#555; margin-bottom:20px;">あなたに効く一冊を処方します。</p>
    <div class="prescription-input-group">
      <input type="text" id="worryInput" placeholder="例：仕事に疲れた、勇気がほしい..." style="flex:1; padding:12px 20px; border:1px solid #ddd; border-radius:30px; outline:none; font-family:inherit;">
      <button id="prescribeBtn" class="prescribe-btn" onclick="runPrescription()">処方箋をもらう</button>
    </div>
    <div id="prescriptionResultArea">
      <div class="prescription-card">
        <div class="prescription-book-box" id="prescribedBookBox"></div>
        <div id="prescriptionText" style="line-height:1.8; font-size:14px;"></div>
      </div>
      <div style="text-align:center;">
        <button class="cancel-btn" style="margin-top:20px; font-size:11px; padding:8px 16px; border:none; border-radius:20px; background:#eee; cursor:pointer;" onclick="resetPrescription()">もう一度相談する</button>
      </div>
    </div>
  </div>

  <!-- プロフィール -->
  <div id="adminProfile" class="admin-profile-section">
    <div class="admin-profile-card">
      <img src="ChatGPT Image 2026年5月6日 19_04_17.png" alt="管理人" class="admin-avatar">
      <div class="admin-info">
        <h3 class="admin-name">💼 管理人：s h o t a</h3>
        <p class="admin-bio">恋愛小説、海外文学、エッセイを中心に、日々物語を読んでいます。この本棚が新しい一冊との出会いになれば嬉しいです。</p>
      </div>
    </div>
  </div>

  <!-- 読者コーナー -->
  <div id="readerSection" class="reader-section">
    <h2>👑 みんなのおすすめ人気ランキング</h2>
    <div id="readerGrid" class="reader-grid"></div>
  </div>

</div>

<!-- 🔴おすすめ本を教えるボタン（右下固定） -->
<button class="floating-btn" onclick="openModal()">💡 おすすめ本を教える</button>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxnivqaTxApYmc8wWPn8BUk5p_caL2n6dPAjau7_8xkva7rLCODuY8idJJe0GJ-dyrw/exec"; 
  
    const AI_AVATARS = {
    normal: {
      normal: "司書＿通常.png",
      searching: "司書_探し中.png"
    },
    hot: {
      normal: "熱血_通常.png",
      searching: "熱血_探し中.png"
    },
    cat: {
      normal: "猫_通常.png",
      searching: "猫_探し中.png"
    },
    pharmacist: {
      normal: "処方箋_通常.png",
      searching: "処方箋_探し中.png"
    }
  };

  let allData = [], readerData = [], gachaPool = [], activeTags = [], currentSortMode = 'new', isMyShelfMode = false;
  let likedBooks = JSON.parse(localStorage.getItem('likedBooks')) || [];
  let readBooks = JSON.parse(localStorage.getItem('readBooks')) || [];
  let savedBooks = JSON.parse(localStorage.getItem('savedBooks')) || [];

  window.onload = async () => {
    updateChatAvatar('normal');
    document.getElementById('pharmacistAvatar').src = AI_AVATARS.pharmacist.normal;
    try {
      const res = await fetch(API_URL);
      const data = await res.json();
      allData = data.books;
      readerData = data.readerBooks || [];
      generateFilterTags(allData);
      renderAll();
      fetchMood();
      gachaPool = [...allData.map(b => ({ ...b, type: 'admin' })), ...readerData.map(b => ({ ...b, type: 'reader' }))];
      document.getElementById("loading").style.display = "none";
    } catch (e) { alert("データの取得に失敗しました。"); }
  };

  function updateChatAvatar(state) {
    const persona = document.getElementById('aiPersona').value;
    const img = document.getElementById('aiChatAvatar');
    if(img) {
      img.style.opacity = 0;
      setTimeout(() => { img.src = AI_AVATARS[persona][state]; img.style.opacity = 1; }, 200);
    }
  }

  async function fetchMood() {
    try {
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getMood" }) });
      const data = await res.json();
      document.getElementById("shelfMood").textContent = "✨ " + data.mood;
    } catch(e) { document.getElementById("shelfMood").textContent = "✨ 今日も素敵な本が揃っています。"; }
  }

  function renderAll() {
    const searchText = document.getElementById("searchBar").value.toLowerCase();
    let filtered = allData.filter(book => {
      const matchText = (book.title + book.author).toLowerCase().includes(searchText);
      const matchTags = activeTags.every(t => book.tags.includes(t));
      const matchSave = isMyShelfMode ? savedBooks.includes(book.id) : true;
      return matchText && matchTags && matchSave;
    });
    if (currentSortMode === 'new') filtered.sort((a, b) => new Date(b.updated) - new Date(a.updated));
    else if (currentSortMode === 'like') filtered.sort((a, b) => b.likes - a.likes);
    document.getElementById("grid").innerHTML = filtered.map((book, i) => generateCardHTML(book, i)).join("");
    const sortedReader = [...readerData].sort((a,b) => b.likes - a.likes);
    document.getElementById("readerGrid").innerHTML = sortedReader.map((book, i) => generateReaderCardHTML(book, i)).join("");
    setTimeout(observeCards, 100);
  }

  function generateCardHTML(book, index) {
    const isLiked = likedBooks.includes(book.id), isRead = readBooks.includes(book.id), isSaved = savedBooks.includes(book.id);
    const diffDays = (new Date() - new Date(book.updated)) / (1000 * 60 * 60 * 24);
    const newBadge = diffDays <= 7 ? `<div class="new-badge">New!</div>` : '';
    let badgeHtml = (currentSortMode === 'like' && index <= 2 && book.likes > 0) ? `<div class="rank-badge rank-${index+1}">${index+1}位</div>` : "";
    let stars = "";
    if (book.rating) {
      const s = parseInt(book.rating);
      if(!isNaN(s)) stars = `<div class="rating">${"★".repeat(s)}${"☆".repeat(5-s)}</div>`;
    }
    return `
      <div class="card">
        ${newBadge}${badgeHtml}
        <img src="${book.image}" class="cover" onerror="this.src='https://via.placeholder.com/80x130?text=No+Image'">
        <div class="title">${book.title}</div>
        <div class="author">${book.author}</div>
        ${stars}
        <div class="card-tags">${book.tags.map(t => `<span class="card-tag">${t}</span>`).join("")}</div>
        <div class="button-area">
          <div class="primary-buttons">
            <a href="${book.url}" target="_blank" class="button">感想</a>
            <button onclick="showSummary('${book.id}')" class="button ai-summary-btn">📖 解説</button>
          </div>
          <div class="action-row">
            <button onclick="handleAction('${book.id}', 'likeBook')" class="like-btn ${isLiked?'liked':''}"><span>❤️</span>${book.likes}<br>いいね</button>
            <button onclick="handleAction('${book.id}', 'readBook')" class="read-btn ${isRead?'read':''}"><span>✅</span>${book.reads || 0}<br>読了</button>
            <button onclick="toggleSave('${book.id}')" class="save-btn ${isSaved?'saved':''}"><span>🔖</span><br>${isSaved?'保存中':'保存'}</button>
          </div>
        </div>
      </div>`;
  }

  function generateReaderCardHTML(book, index) {
    const isLiked = likedBooks.includes(book.id), isRead = readBooks.includes(book.id);
    let badgeHtml = index <= 2 && book.likes > 0 ? `<div class="rank-badge rank-${index+1}">${index+1}位</div>` : "";
    return `<div class="reader-card">
        ${badgeHtml}
        <div style="font-size:14px; background:#fdfbf7; padding:15px; border-radius:10px; border-left:4px solid #ffcc80; margin-bottom:15px; flex-grow:1;">${book.reason.replace(/\n/g, '<br>')}</div>
        <div style="font-weight:bold; font-size:14px;">📖 ${book.title}</div>
        <div style="font-size:12px; color:#777; margin-bottom:15px;">✍️ ${book.author}</div>
        <div class="action-row">
          <button onclick="handleAction('${book.id}', 'likeBook')" class="like-btn ${isLiked?'liked':''}"><span>❤️</span>${book.likes}<br>いいね</button>
          <button onclick="handleAction('${book.id}', 'readBook')" class="read-btn ${isRead?'read':''}"><span>✅</span>${book.reads || 0}<br>読了</button>
        </div>
      </div>`;
  }

  function setAiPrompt(p) { document.getElementById("aiQuery").value = p; runAiConsult(); }

  async function runAiConsult() {
    const query = document.getElementById("aiQuery").value;
    if (!query) return;
    const btn = document.getElementById("aiBtn"), resultArea = document.getElementById("aiResultArea"), aiText = document.getElementById("aiText"), aiGrid = document.getElementById("aiBooksGrid");
    btn.disabled = true; btn.textContent = "考え中...";
    updateChatAvatar('searching');
    resultArea.style.display = "block"; aiText.innerHTML = "本棚から探しています..."; aiGrid.innerHTML = "";
    try {
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ message: query, persona: document.getElementById("aiPersona").value }) });
      const data = await res.json();
      aiText.innerHTML = data.result.replace(/\n/g, "<br>");
      if (data.recommendedBooks) {
        const updated = data.recommendedBooks.map(aib => [...allData, ...readerData].find(f => f.id === aib.id) || aib);
        aiGrid.innerHTML = updated.map(b => generateCardHTML(b, -1)).join("");
        setTimeout(observeCards, 100);
      }
      document.getElementById("resetBtn").style.display = "inline-block";
    } catch (e) { aiText.innerHTML = "エラーが発生しました。"; } 
    finally { btn.disabled = false; btn.textContent = "相談する"; updateChatAvatar('normal'); }
  }

  async function runPrescription() {
    const worry = document.getElementById("worryInput").value.trim();
    if (!worry) return alert("お悩みを入力してください");
    const btn = document.getElementById("prescribeBtn"), avatar = document.getElementById("pharmacistAvatar");
    btn.disabled = true; btn.textContent = "処方中...";
    avatar.src = AI_AVATARS.pharmacist.searching;
    try {
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "prescribe", message: worry }) });
      const data = await res.json();
      const freshBook = [...allData, ...readerData].find(f => f.id === data.recommendedBook.id) || data.recommendedBook;
      document.getElementById("prescribedBookBox").innerHTML = `
        <img src="${freshBook.image}" style="width:60px; height:85px; border-radius:4px; object-fit:cover;" onerror="this.src='https://via.placeholder.com/60x85?text=No+Img'">
        <div>
          <div style="font-weight:bold; font-size:14px; color:#01579b;">薬：『${freshBook.title}』</div>
          <button onclick="showSummary('${freshBook.id}')" style="margin-top:5px; font-size:10px; border:none; background:#e1f5fe; color:#01579b; padding:4px 8px; border-radius:10px; cursor:pointer; font-weight:bold;">効能を見る</button>
        </div>`;
      document.getElementById("prescriptionText").innerHTML = data.prescription.replace(/\n/g, "<br>");
      document.getElementById("prescriptionResultArea").style.display = "block";
    } catch(e) { alert("失敗しました"); } finally { btn.disabled = false; btn.textContent = "処方箋をもらう"; avatar.src = AI_AVATARS.pharmacist.normal; }
  }

  async function showSummary(id) {
    const book = [...allData, ...readerData].find(b => b.id === id);
    if (!book) return;
    document.getElementById("summaryBookTitle").textContent = "📖 AI司書の解説：" + book.title;
    document.getElementById("summaryText").innerHTML = "AI司書がレビューを読み込み中...";
    document.getElementById("summaryModal").style.display = "flex";
    try {
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getSummary", bookData: book }) });
      const data = await res.json();
      document.getElementById("summaryText").innerHTML = data.summary.replace(/\n/g, "<br>");
    } catch (e) { document.getElementById("summaryText").innerHTML = "要約に失敗しました。"; }
  }

  // その他UI系
  function closeSummaryModal() { document.getElementById("summaryModal").style.display = "none"; }
  function resetPrescription() { document.getElementById("worryInput").value = ""; document.getElementById("prescriptionResultArea").style.display = "none"; }
  function resetAi() { document.getElementById("aiQuery").value = ""; document.getElementById("aiResultArea").style.display = "none"; }
  function toggleMyShelf() { isMyShelfMode = !isMyShelfMode; document.getElementById("myShelfBtn").classList.toggle("active"); renderAll(); }
  function changeSortMode(m) { currentSortMode = m; document.getElementById("sortNewBtn").classList.toggle("active", m === 'new'); document.getElementById("sortLikeBtn").classList.toggle("active", m === 'like'); renderAll(); }
  function closeModal() { document.getElementById("submitModal").style.display = "none"; }
  function openModal() { document.getElementById("submitModal").style.display = "flex"; }
  function openDiagnoseModal() { document.getElementById("diagnoseModal").style.display = "flex"; }
  function closeDiagnoseModal() { document.getElementById("diagnoseModal").style.display = "none"; }
  function closeGacha() { document.getElementById('gachaModal').style.display = 'none'; }
  
  async function handleAction(pageId, action) {
    const list = action === 'likeBook' ? likedBooks : readBooks;
    if (list.includes(pageId)) return;
    list.push(pageId);
    localStorage.setItem(action === 'likeBook' ? 'likedBooks' : 'readBooks', JSON.stringify(list));
    if (action === 'readBook') spawnConfetti();
    renderAll();
    fetch(API_URL, { method: "POST", body: JSON.stringify({ action: action, pageId: pageId }) });
  }

  function toggleSave(id) {
    if (savedBooks.includes(id)) savedBooks = savedBooks.filter(i => i !== id);
    else savedBooks.push(id);
    localStorage.setItem('savedBooks', JSON.stringify(savedBooks));
    renderAll();
  }

  function spawnConfetti() {
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.backgroundColor = ['#ffc0cb', '#ffb6c1', '#ff69b4', '#fff0f5'][Math.floor(Math.random()*4)];
      c.style.animation = `fall ${Math.random()*3+2}s linear forwards`;
      c.style.width = Math.random() * 10 + 5 + 'px'; c.style.height = c.style.width;
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 5000);
    }
  }

  function observeCards() {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) { setTimeout(() => entry.target.classList.add('show'), 50); observer.unobserve(entry.target); } });
    }, { threshold: 0.1 });
    document.querySelectorAll('.card:not(.show), .reader-card:not(.show)').forEach(c => observer.observe(c));
  }

  function generateFilterTags(books) {
    const container = document.getElementById("tagsContainer");
    const uniqueTags = new Set();
    books.forEach(b => b.tags.forEach(t => uniqueTags.add(t)));
    uniqueTags.forEach(tag => {
      const btn = document.createElement("button");
      btn.className = "filter-tag"; btn.textContent = tag;
      btn.onclick = () => { btn.classList.toggle("active"); if (activeTags.includes(tag)) activeTags = activeTags.filter(t => t !== tag); else activeTags.push(tag); renderAll(); };
      container.appendChild(btn);
    });
  }

  function playGacha() {
    if (gachaPool.length === 0) return;
    const modal = document.getElementById('gachaModal'), slotImg = document.getElementById('gachaSlotImg'), titleEl = document.getElementById('gachaTitle'), descEl = document.getElementById('gachaDesc'), actions = document.getElementById('gachaActions');
    modal.style.display = 'flex'; actions.style.display = 'none';
    titleEl.innerHTML = "運命の本を探しています...<br>🎲 カラカラカラ...";
    let counter = 0;
    const interval = setInterval(() => {
      slotImg.src = gachaPool[Math.floor(Math.random() * gachaPool.length)].image || 'https://via.placeholder.com/80x130?text=Wait';
      if (++counter > 25) {
        clearInterval(interval);
        const winner = gachaPool[Math.floor(Math.random() * gachaPool.length)];
        slotImg.src = winner.image || 'https://via.placeholder.com/80x130?text=No+Image';
        titleEl.innerHTML = "✨ 運命の一冊はコレだ！ ✨<br><span style='color:#d35400;'>" + winner.title + "</span>";
        descEl.innerHTML = `著：${winner.author}`;
        if (winner.url && winner.url !== "#" && winner.url !== "javascript:void(0)") {
          document.getElementById('gachaLinkBtn').onclick = () => window.open(winner.url, '_blank');
          document.getElementById('gachaLinkBtn').style.display = 'block';
        } else { document.getElementById('gachaLinkBtn').style.display = 'none'; }
        actions.style.display = 'flex';
      }
    }, 100);
  }

  async function submitBook() {
    const title = document.getElementById("submitTitle").value.trim(), reason = document.getElementById("submitReason").value.trim(), author = document.getElementById("submitAuthor").value.trim(), btn = document.getElementById("submitConfirmBtn");
    if (!title || !reason) return alert("必須項目を埋めてください");
    btn.disabled = true; btn.textContent = "送信中...";
    try { await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "submitBook", data: { title, author, reason } }) }); alert("送信しました！"); closeModal(); } 
    catch (e) { alert("失敗しました"); } finally { btn.disabled = false; btn.textContent = "管理人に送る"; }
  }

  document.getElementById("updateDbBtn").onclick = async () => {
    const pass = prompt("合言葉を入力してください"); if (!pass) return;
    const btn = document.getElementById("updateDbBtn"); btn.disabled = true; btn.textContent = "更新中...";
    try {
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "updateDB", password: pass }) });
      const data = await res.json();
      if (data.status === "success") { alert("更新完了！"); location.reload(); } else { alert(data.message); }
    } catch (e) { alert("エラー"); } finally { btn.disabled = false; btn.textContent = "🔄 AIに本を覚えさせる"; }
  };

  async function runDiagnose() {
    const input = document.getElementById("diagnoseInput").value.trim();
    if (!input) return alert("入力してください");
    closeDiagnoseModal();
    const resultArea = document.getElementById("aiResultArea"), aiText = document.getElementById("aiText"), aiGrid = document.getElementById("aiBooksGrid");
    resultArea.style.display = "block"; aiText.innerHTML = "カルテを作成中..."; aiGrid.innerHTML = "";
    try {
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "diagnose", message: input }) });
      const data = await res.json();
      aiText.innerHTML = "<h4 style='color:#00796b;margin-top:0;'>🩺 あなたの読書カルテ</h4>" + data.result.replace(/\n/g, "<br>");
      if (data.recommendedBooks) {
        const updated = data.recommendedBooks.map(aib => [...allData, ...readerData].find(f => f.id === aib.id) || aib);
        aiGrid.innerHTML = updated.map(b => generateCardHTML(b, -1)).join("");
        setTimeout(observeCards, 100);
      }
    } catch (e) { aiText.innerHTML = "分析に失敗しました。"; }
  }
</script>
</body>
</html>
