<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Book Shelf</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* 共通設定 */
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: 'Zen Maru Gothic', sans-serif; background: #f9fbfb; color: #333; }
    
    /* ヘッダー背景 */
    .header { text-align: center; padding: 60px 20px 80px; position: relative; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; background: linear-gradient(-45deg, #2c3e50, #000000, #4ca1af, #2c3e50); background-size: 400% 400%; animation: gradientBG 15s ease infinite;}
    @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    
    .header-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.2); z-index: 1; }
    .header-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; }
    .header h1 { font-size: 34px; margin: 0 0 15px 0; text-shadow: 0 2px 10px rgba(0,0,0,0.5); letter-spacing: 2px;}

    /* ナビゲーションボタン */
    .nav-links { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 25px; }
    .nav-btn { background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255,255,255,0.4); color: white; padding: 8px 18px; border-radius: 20px; font-size: 11px; font-weight: bold; cursor: pointer; backdrop-filter: blur(5px); transition: 0.3s; text-decoration: none;}
    .nav-btn:hover { background: white; color: #2c3e50; transform: translateY(-2px); }

    /* 管理者ツール（右上） */
    .admin-tools { position: absolute; top: 10px; right: 10px; z-index: 100; display: flex; gap: 5px;}
    .update-db-btn { font-size: 9px; padding: 5px 10px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; cursor: pointer; color: white; transition: 0.3s; backdrop-filter: blur(4px); font-family: inherit;}
    .add-book-btn { font-size: 9px; padding: 5px 10px; background: rgba(46, 125, 50, 0.6); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; cursor: pointer; color: white; transition: 0.3s; backdrop-filter: blur(4px); font-family: inherit;}

    /* AIの空気感 */
    .shelf-mood { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(5px); display: inline-block; padding: 8px 20px; border-radius: 30px; font-size: 13px; border: 1px solid rgba(255,255,255,0.3); max-width: 85%; }
    
    .container { max-width: 900px; margin: auto; padding: 20px; }

    /* ガチャ */
    .gacha-section { text-align: center; margin-top: -45px; margin-bottom: 45px; position: relative; z-index: 90; }
    .gacha-btn { background: linear-gradient(45deg, #ff6b6b, #ff8e53); color: white; font-size: 16px; font-weight: bold; padding: 15px 40px; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4); transition: 0.3s; animation: pulseGacha 2s infinite; font-family: 'Zen Maru Gothic', sans-serif;}

    /* AI相談セクション */
    .ai-section { background: #fff; border: 1px solid #e0f2e9; padding: 25px; border-radius: 20px; margin-bottom: 40px; box-shadow: 0 8px 25px rgba(0,0,0,0.04); }
    .ai-top-row { display: flex; align-items: flex-end; gap: 20px; margin-bottom: 20px; }
    .ai-avatar-circle { width: 75px; height: 70px; border-radius: 50%; border: 3px solid #e0f2e9; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.1); background: #eee; transition: opacity 0.3s ease; }
    .ai-header { flex: 1; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;}
    .diagnose-btn { background: #e0f7fa; color: #00796b; border: 1px solid #b2ebf2; padding: 8px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; font-family: inherit;}

    .ai-input-group { display: flex; gap: 10px; flex-wrap: wrap;}
    .persona-select { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff; cursor: pointer;}
    input[type="text"], input[type="number"], select, textarea { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; outline: none;}
    .ai-btn { background: #2f3e2f; color: white; border: none; padding: 10px 25px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: bold;}
    .reset-btn { background: #fff; color: #2f3e2f; border: 1px solid #2f3e2f; padding: 10px 20px; border-radius: 8px; cursor: pointer; display: none; font-weight: bold;}

    .prompt-suggestions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
    .prompt-btn { font-size: 11px; padding: 8px 15px; border-radius: 20px; background: #f4f7f6; color: #2f3e2f; border: 1px solid #e6f4ea; cursor: pointer; transition: 0.2s; font-family: inherit;}

    #aiResultArea { display: none; margin-top: 25px; border-top: 1px dashed #ddd; padding-top: 25px;}
    .ai-text { line-height: 1.8; font-size: 14.5px; color: #444; border-left: 4px solid #e6f4ea; padding: 15px; background: #fafdfb; border-radius: 0 10px 10px 0;}
    
    /* カードグリッド */
    .grid { display: grid; gap: 25px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); margin-bottom: 60px;}
    .card, .reader-card { background: white; border-radius: 15px; padding: 20px 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; position: relative; display: flex; flex-direction: column; align-items: center; opacity: 0; transform: translateY(40px); transition: all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1); }
    .card.show, .reader-card.show { opacity: 1; transform: translateY(0); }
    .card:hover, .reader-card:hover { transform: translateY(-8px); box-shadow: 0 15px 35px rgba(0,0,0,0.12); }
    
    .new-badge { position: absolute; top: -8px; left: -8px; background: #ff4757; color: white; font-size: 11px; font-weight: bold; padding: 4px 12px; border-radius: 12px; transform: rotate(-5deg); z-index: 100;}
    .rank-badge { position: absolute; top: -12px; right: -12px; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; color: white; box-shadow: 0 4px 8px rgba(0,0,0,0.2); z-index: 100;}

    .cover { width: 95px; height: 135px; object-fit: cover; border-radius: 6px; margin-bottom: 12px; box-shadow: 3px 3px 10px rgba(0,0,0,0.15);}
    .title { font-weight: bold; font-size: 14px; margin: 0 0 5px 0; line-height: 1.4; }
    .author { font-size: 12px; color: #777; margin-bottom: 8px; }
    .rating { color: #f1c40f; font-size: 13px; margin-bottom: 8px; letter-spacing: 2px; }
    
    .button-area { width: 100%; margin-top: auto; z-index: 20; display: flex; flex-direction: column; gap: 6px;}
    .primary-buttons { display: flex; gap: 5px; }
    .button { flex: 1; padding: 10px 5px; background: #333; color: #fff; text-decoration: none; border-radius: 15px; font-size: 10px; transition: 0.2s; font-weight: bold; text-align: center; border: none; cursor: pointer; font-family: inherit;}
    .button.ai-summary-btn { background: #e0f2f1; color: #00695c; border: 1px solid #b2dfdb;}
    
    .action-row { display: flex; gap: 5px; width: 100%; }
    .action-row button { 
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; padding: 6px 2px; border-radius: 12px; font-size: 8px; border: 1px solid #eee; 
      background: #fdfdfd; cursor: pointer; font-family: inherit; font-weight: bold; transition: 0.2s; color: #666;
    }
    .action-row button span { font-size: 12px; }

    /* 処方箋セクション */
    .prescription-section { background: #fff; border-radius: 20px; padding: 40px 30px; margin-bottom: 60px; border: 1px solid #e1f5fe; box-shadow: 0 10px 30px rgba(1, 87, 155, 0.05); scroll-margin-top: 20px; }
    .prescription-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; justify-content: center;}
    .prescription-title { font-size: 22px; font-weight: bold; color: #01579b; margin: 0; }
    .prescription-input-group { display: flex; gap: 10px; margin: 20px auto 0; max-width: 600px; }
    .prescribe-btn { background: #01579b; color: white; border: none; padding: 12px 30px; border-radius: 30px; cursor: pointer; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 15px rgba(1, 87, 155, 0.2); white-space: nowrap;}
    
    #prescriptionResultArea { display: none; margin-top: 30px; animation: fadeIn 0.5s ease; }
    .prescription-card { background: #f1f8ff; border: 2px dashed #0288d1; border-radius: 15px; padding: 25px; position: relative; margin: auto; max-width: 600px;}
    .prescription-card::before { content: "処方箋"; position: absolute; top: -12px; right: 20px; background: white; padding: 0 10px; color: #0288d1; font-weight: bold; font-size: 12px;}
    .prescription-book-box { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; background: white; padding: 15px; border-radius: 10px;}
    
    /* 管理人プロフィール */
    .admin-profile-section { margin-bottom: 60px; padding: 0 10px; scroll-margin-top: 20px; }
    .admin-profile-card { max-width: 700px; margin: auto; background: #fff; border-radius: 15px; padding: 30px; display: flex; align-items: center; gap: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e0f2e9; position: relative; overflow: hidden;}
    .admin-avatar { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid #f9fbfb; box-shadow: 0 4px 10px rgba(0,0,0,0.1);}
    .admin-name { margin: 0 0 12px 0; font-size: 20px; color: #2f3e2f; display: flex; align-items: center; gap: 8px; line-height: 1.4;}

    /* おすすめ投稿ボタン */
    .floating-btn {
      position: fixed; bottom: 25px; right: 25px;
      background: linear-gradient(135deg, #ff8c00, #ff6b6b); color: white;
      padding: 16px 28px; border-radius: 50px; border: none;
      font-weight: bold; font-family: inherit; cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 140, 0, 0.4);
      z-index: 1000; animation: buttonPulse 2.5s infinite;
    }

    @keyframes buttonPulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 140, 0, 0.7); }
      70% { box-shadow: 0 0 0 20px rgba(255, 140, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 140, 0, 0); }
    }

    /* モーダル */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(3px);}
    .modal-content { background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: 0 15px 40px rgba(0,0,0,0.2); animation: popModal 0.3s ease-out;}
    @keyframes popModal { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    #loading { position: fixed; inset: 0; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5000; }
    .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #2f3e2f; border-radius: 50%; animation: spin 1s linear infinite; }

    @media (max-width: 767px) {
      .header h1 { font-size: 24px; padding-top: 20px; }
      .admin-tools { right: 5px; top: 5px; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .prescription-input-group { flex-direction: column; }
    }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p style="margin-top: 15px; font-size: 14px; font-weight:bold;">本棚を整頓中...</p>
</div>

<!-- 🔴管理者用：本を追加モーダル -->
<div id="adminAddModal" class="modal-overlay">
  <div class="modal-content">
    <h3 style="margin-top:0; color:#2e7d32;">📖 本棚に新刊を追加する</h3>
    <div style="background:#f1f8f5; padding:15px; border-radius:10px; margin-bottom:20px;">
      <label style="font-size:11px; font-weight:bold; color:#2e7d32;">ISBNで自動入力</label>
      <div style="display:flex; gap:5px; margin-top:5px;">
        <input type="text" id="isbnInput" placeholder="13桁のISBNを入力" style="flex:1;">
        <button onclick="fetchISBN()" style="background:#2e7d32; color:white; border:none; border-radius:8px; padding:0 15px; cursor:pointer; font-weight:bold;">検索</button>
      </div>
    </div>
    <div style="display:grid; gap:12px;">
      <input type="text" id="addTitle" placeholder="タイトル">
      <input type="text" id="addAuthor" placeholder="著者">
      <input type="text" id="addImage" placeholder="画像URL（ISBN検索で自動取得）">
      <div style="display:flex; gap:10px; align-items:center;">
        <label style="font-size:12px;">評価：</label>
        <select id="addRating" style="flex:1;">
          <option value="5">★★★★★ (5)</option>
          <option value="4">★★★★☆ (4)</option>
          <option value="3">★★★☆☆ (3)</option>
          <option value="2">★★☆☆☆ (2)</option>
          <option value="1">★☆☆☆☆ (1)</option>
        </select>
      </div>
      <textarea id="addReel" placeholder="リール文章（サイトのカードに表示される短い紹介）" style="height:60px;"></textarea>
      <textarea id="addReview" placeholder="レビュー全文（AIの知識ベースになります）" style="height:120px;"></textarea>
    </div>
    <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 25px;">
      <button onclick="closeAdminAddModal()" style="padding:10px 20px; border:none; border-radius:8px; background:#eee; cursor:pointer;">キャンセル</button>
      <button id="adminSubmitBtn" onclick="submitAdminBook()" style="padding:10px 20px; border:none; border-radius:8px; background:#2e7d32; color:white; cursor:pointer; font-weight:bold;">本棚に並べる</button>
    </div>
  </div>
</div>

<!-- その他既存モーダル -->
<div id="gachaModal" class="modal-overlay"><div class="modal-content"><div id="gachaTitle" style="font-size:18px; font-weight:bold; text-align:center; margin-bottom:15px;"></div><div style="width:140px; height:200px; margin:20px auto; border-radius:10px; overflow:hidden;"><img id="gachaSlotImg" src="" style="width:100%; height:100%; object-fit:cover;"></div><div id="gachaDesc" style="text-align:center; font-size:14px; margin-bottom:20px;"></div><div id="gachaActions" style="display:none; gap:10px; justify-content:center;"><button onclick="closeGacha()" style="padding:10px 20px; border-radius:20px; border:none; background:#eee; cursor:pointer;">閉じる</button><button id="gachaLinkBtn" style="padding:10px 20px; border-radius:20px; border:none; background:#ff8c00; color:white; cursor:pointer;">詳細を見る</button></div></div></div>
<div id="summaryModal" class="modal-overlay"><div class="modal-content"><h3 id="summaryBookTitle" style="margin:0 0 15px; color:#00695c; font-size:18px;"></h3><div id="summaryText" style="line-height:1.8; font-size:14px; background:#f9f9f9; padding:20px; border-radius:15px; border-left:5px solid #00695c;"></div><div style="text-align:right; margin-top:25px;"><button onclick="closeSummaryModal()" style="padding:10px 25px; border:none; border-radius:8px; background:#eee; cursor:pointer;">閉じる</button></div></div></div>
<div id="diagnoseModal" class="modal-overlay"><div class="modal-content"><h3>🩺 読書カルテ診断</h3><textarea id="diagnoseInput" placeholder="作品を3つ書いてね" style="width:100%; height:120px;"></textarea><div style="text-align:right; margin-top:20px;"><button onclick="closeDiagnoseModal()" style="padding:10px 20px; border:none; background:#eee; border-radius:8px;">キャンセル</button><button onclick="runDiagnose()" style="padding:10px 20px; border:none; background:#00796b; color:white; border-radius:8px;">分析</button></div></div></div>
<div id="submitModal" class="modal-overlay"><div class="modal-content"><h3>おすすめ本を教えてください</h3><input type="text" id="submitTitle" placeholder="書籍名" style="width:100%; margin-bottom:15px;"><input type="text" id="submitAuthor" placeholder="著者" style="width:100%; margin-bottom:15px;"><textarea id="submitReason" placeholder="理由" style="width:100%; height:100px;"></textarea><div style="text-align:right; margin-top:20px;"><button onclick="closeModal()" style="padding:10px 20px; border:none; background:#eee; border-radius:8px;">キャンセル</button><button onclick="submitBook()" style="padding:10px 20px; border:none; background:#2f3e2f; color:white; border-radius:8px;">送信</button></div></div></div>

<!-- ヘッダー -->
<div class="header">
  <div class="header-overlay"></div>
  <div class="admin-tools">
    <button class="add-book-btn" onclick="openAdminAddModal()">📖 本を追加</button>
    <button id="updateDbBtn" class="update-db-btn">🔄 AI学習更新</button>
  </div>
  <div class="header-content">
    <h1>AI Book Shelf</h1>
    <div class="nav-links">
      <a href="#adminProfile" class="nav-btn">💼 プロフィール</a>
      <a href="#prescriptionSection" class="nav-btn">💊 処方箋をもらう</a>
      <a href="#readerSection" class="nav-btn">👑 みんなの推薦</a>
    </div>
    <div id="shelfMood" class="shelf-mood">本棚を整頓中...</div>
  </div>
</div>

<div class="container">
  <div class="gacha-section"><button class="gacha-btn" onclick="playGacha()">🎲 運命の一冊ガチャを回す</button></div>

  <!-- AI相談 -->
  <div class="ai-section">
    <div class="ai-top-row"><img id="aiChatAvatar" class="ai-avatar-circle" src=""><div class="ai-header"><strong>🤖 AI相談</strong><button class="diagnose-btn" onclick="openDiagnoseModal()">🩺 診断カルテ</button></div></div>
    <div class="ai-input-group">
      <select id="aiPersona" class="persona-select" onchange="updateChatAvatar('normal')"><option value="normal">👓 丁寧な司書さん</option><option value="hot">🔥 熱血書店員</option><option value="cat">🐱 猫</option></select>
      <input type="text" id="aiQuery" placeholder="今の気分は？"><button id="aiBtn" class="ai-btn" onclick="runAiConsult()">相談</button>
    </div>
    <div class="prompt-suggestions"><button class="prompt-btn" onclick="setAiPrompt('☕ 休日にのんびり読めるエッセイ')">☕ のんびり</button><button class="prompt-btn" onclick="setAiPrompt('😭 思いっきり泣ける恋愛小説')">😭 泣きたい</button></div>
    <div id="aiResultArea"><div id="aiText" class="ai-text"></div><div id="aiBooksGrid" class="grid" style="margin-top:20px;"></div><button class="reset-btn" onclick="resetAi()">リセット</button></div>
  </div>

  <div class="filter-section"><input type="text" id="searchBar" class="search-bar" placeholder="タイトル検索..." oninput="renderAll()"><div id="tagsContainer" class="tags-container"></div><div class="sort-options"><button id="sortNewBtn" class="sort-btn active" onclick="changeSortMode('new')">📅 新着</button><button id="sortLikeBtn" class="sort-btn" onclick="changeSortMode('like')">❤️ 人気</button><button id="myShelfBtn" class="sort-btn my-shelf-btn" onclick="toggleMyShelf()">🔖 あとで読む</button></div></div>

  <div id="grid" class="grid"></div>

  <!-- 処方箋 -->
  <div id="prescriptionSection" class="prescription-section">
    <div class="prescription-header"><img id="pharmacistAvatar" class="ai-avatar-circle" src=""><div class="prescription-title">💊 本の処方箋</div></div>
    <div class="prescription-input-group"><input type="text" id="worryInput" placeholder="お悩みは？"><button class="prescribe-btn" onclick="runPrescription()">処方箋をもらう</button></div>
    <div id="prescriptionResultArea"><div class="prescription-card"><div class="prescription-book-box" id="prescribedBookBox"></div><div id="prescriptionText"></div></div><div style="text-align:center;"><button class="cancel-btn" onclick="resetPrescription()">もう一度</button></div></div>
  </div>

  <!-- プロフィール -->
  <div id="adminProfile" class="admin-profile-section"><div class="admin-profile-card"><img src="ChatGPT Image 2026年5月6日 19_04_17.png" class="admin-avatar"><div class="admin-info"><h3 class="admin-name">💼 管理人<br>s h o t a</h3><p class="admin-bio">恋愛小説、海外文学を中心に物語を読んでいます。年末のベスト5選びが恒例行事です。</p></div></div></div>

  <!-- 読者コーナー -->
  <div id="readerSection" class="reader-section"><h2>👑 みんなのおすすめ人気ランキング</h2><div id="readerGrid" class="reader-grid"></div></div>
</div>

<button class="floating-btn" onclick="openModal()">💡 おすすめ本を教える</button>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxnivqaTxApYmc8wWPn8BUk5p_caL2n6dPAjau7_8xkva7rLCODuY8idJJe0GJ-dyrw/exec"; 
  
  const AI_AVATARS = {
    normal: { normal: "司書＿通常.png", searching: "司書_探し中.png" },
    hot: { normal: "熱血_通常.png", searching: "熱血_探し中.png" },
    cat: { normal: "猫_通常.png", searching: "猫_探し中.png" },
    pharmacist: { normal: "処方箋_通常.png", searching: "処方箋_探し中.png" }
  };

  let allData = [], readerData = [], gachaPool = [], activeTags = [], currentSortMode = 'new', isMyShelfMode = false;
  let likedBooks = JSON.parse(localStorage.getItem('likedBooks')) || [], readBooks = JSON.parse(localStorage.getItem('readBooks')) || [], savedBooks = JSON.parse(localStorage.getItem('savedBooks')) || [];

  window.onload = async () => {
    updateChatAvatar('normal'); document.getElementById('pharmacistAvatar').src = AI_AVATARS.pharmacist.normal;
    try {
      const res = await fetch(API_URL); const data = await res.json();
      allData = data.books; readerData = data.readerBooks || [];
      generateFilterTags(allData); renderAll(); fetchMood();
      gachaPool = [...allData.map(b => ({ ...b, type: 'admin' })), ...readerData.map(b => ({ ...b, type: 'reader' }))];
      document.getElementById("loading").style.display = "none";
    } catch (e) { alert("読込失敗"); }
  };

  function updateChatAvatar(state) {
    const persona = document.getElementById('aiPersona').value; const img = document.getElementById('aiChatAvatar');
    if(img) { img.style.opacity = 0; setTimeout(() => { img.src = AI_AVATARS[persona][state]; img.style.opacity = 1; }, 200); }
  }

  // 🔴管理者：ISBN検索
  async function fetchISBN() {
    const isbn = document.getElementById("isbnInput").value.trim();
    if(!isbn) return alert("ISBNを入力してください");
    const btn = event.target; btn.disabled = true; btn.textContent = "...";
    try {
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "fetchBookInfo", isbn: isbn }) });
      const data = await res.json();
      if(data.status === "success") {
        document.getElementById("addTitle").value = data.title;
        document.getElementById("addAuthor").value = data.author;
        document.getElementById("addImage").value = data.image;
        document.getElementById("addReview").value = data.summary;
        alert("書籍情報を見つけました！");
      } else { alert(data.message); }
    } catch(e) { alert("取得失敗"); } finally { btn.disabled = false; btn.textContent = "検索"; }
  }

  // 🔴管理者：本棚への追加送信
  async function submitAdminBook() {
    const pass = prompt("管理者の合言葉を入力してください");
    if(!pass) return;
    const data = {
      title: document.getElementById("addTitle").value, author: document.getElementById("addAuthor").value,
      image: document.getElementById("addImage").value, rating: document.getElementById("addRating").value,
      reel: document.getElementById("addReel").value, review: document.getElementById("addReview").value
    };
    if(!data.title) return alert("タイトルは必須です");
    const btn = document.getElementById("adminSubmitBtn"); btn.disabled = true; btn.textContent = "登録中...";
    try {
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "adminAddBook", password: pass, data: data }) });
      const resData = await res.json();
      if(resData.status === "success") {
        alert("本棚に新しい物語が並びました✨ AIの学習を更新して反映させてください。");
        closeAdminAddModal();
      } else { alert(resData.message); }
    } catch(e) { alert("登録失敗"); } finally { btn.disabled = false; btn.textContent = "本棚に並べる"; }
  }

  function openAdminAddModal() { document.getElementById("adminAddModal").style.display = "flex"; }
  function closeAdminAddModal() { document.getElementById("adminAddModal").style.display = "none"; }

  // 既存ロジック
  async function runAiConsult() {
    const q = document.getElementById("aiQuery").value; if (!q) return;
    const btn = document.getElementById("aiBtn"); btn.disabled = true; updateChatAvatar('searching');
    document.getElementById("aiResultArea").style.display = "block";
    document.getElementById("aiText").innerHTML = "探索中..."; document.getElementById("aiBooksGrid").innerHTML = "";
    try {
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ message: q, persona: document.getElementById("aiPersona").value }) });
      const d = await res.json(); document.getElementById("aiText").innerHTML = d.result.replace(/\n/g, "<br>");
      if (d.recommendedBooks) {
        const updated = d.recommendedBooks.map(aib => [...allData, ...readerData].find(f => f.id === aib.id) || aib);
        document.getElementById("aiBooksGrid").innerHTML = updated.map(b => generateCardHTML(b, -1)).join("");
      }
      document.getElementById("resetBtn").style.display = "inline-block";
    } catch (e) { document.getElementById("aiText").innerHTML = "エラー"; } finally { btn.disabled = false; updateChatAvatar('normal'); }
  }

  async function showSummary(id) {
    const book = [...allData, ...readerData].find(b => b.id === id); if (!book) return;
    document.getElementById("summaryBookTitle").textContent = "解説：" + book.title;
    document.getElementById("summaryText").innerHTML = "読み込み中..."; document.getElementById("summaryModal").style.display = "flex";
    try {
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getSummary", bookData: book }) });
      const d = await res.json(); document.getElementById("summaryText").innerHTML = d.summary.replace(/\n/g, "<br>");
    } catch (e) { document.getElementById("summaryText").innerHTML = "失敗"; }
  }

  function generateCardHTML(book, index) {
    const isL = likedBooks.includes(book.id), isR = readBooks.includes(book.id), isS = savedBooks.includes(book.id);
    const n = (new Date() - new Date(book.updated)) / 86400000 <= 7 ? '<div class="new-badge">New!</div>' : '';
    let r = ""; if (book.rating) { const s = parseInt(book.rating); r = `<div class="rating">${"★".repeat(s)}${"☆".repeat(5-s)}</div>`; }
    return `<div class="card">${n}<img src="${book.image}" class="cover" onerror="this.src='https://via.placeholder.com/80x130'"><div class="title">${book.title}</div><div class="author">${book.author}</div>${r}<div class="card-tags">${book.tags.map(t => `<span class="card-tag">${t}</span>`).join("")}</div><div class="button-area"><div class="primary-buttons"><a href="${book.url}" target="_blank" class="button">感想</a><button onclick="showSummary('${book.id}')" class="button ai-summary-btn">📖 解説</button></div><div class="action-row"><button onclick="handleAction('${book.id}', 'likeBook')" class="like-btn ${isL?'liked':''}"><span>❤️</span>${book.likes}<br>いいね</button><button onclick="handleAction('${book.id}', 'readBook')" class="read-btn ${isR?'read':''}"><span>✅</span>${book.reads}<br>読了</button><button onclick="toggleSave('${book.id}')" class="save-btn ${isS?'saved':''}"><span>🔖</span><br>${isS?'保存中':'保存'}</button></div></div></div>`;
  }

  function generateReaderCardHTML(book, i) {
    const isL = likedBooks.includes(book.id);
    return `<div class="reader-card"><div style="font-size:14px; background:#fdfbf7; padding:15px; border-radius:10px; border-left:4px solid #ffcc80; margin-bottom:15px;">${book.reason.replace(/\n/g, '<br>')}</div><div style="font-weight:bold;">📖 ${book.title}</div><div style="font-size:12px; color:#777; margin-bottom:15px;">✍️ ${book.author}</div><div class="action-row"><button onclick="handleAction('${book.id}', 'likeBook')" class="like-btn ${isL?'liked':''}"><span>❤️</span>${book.likes}<br>いいね</button></div></div>`;
  }

  // 補助関数群
  async function runPrescription() {
    const w = document.getElementById("worryInput").value; if (!w) return alert("入力してね");
    const btn = event.target; btn.disabled = true; document.getElementById("pharmacistAvatar").src = AI_AVATARS.pharmacist.searching;
    try {
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "prescribe", message: w }) });
      const d = await res.json();
      document.getElementById("prescribedBookBox").innerHTML = `<img src="${d.recommendedBook.image}" style="width:60px; height:85px; border-radius:4px;"><div style="font-weight:bold; color:#01579b;">薬：『${d.recommendedBook.title}』</div>`;
      document.getElementById("prescriptionText").innerHTML = d.prescription.replace(/\n/g, "<br>");
      document.getElementById("prescriptionResultArea").style.display = "block";
    } catch(e) { alert("失敗"); } finally { btn.disabled = false; document.getElementById("pharmacistAvatar").src = AI_AVATARS.pharmacist.normal; }
  }

  function renderAll() {
    const s = document.getElementById("searchBar").value.toLowerCase();
    let f = allData.filter(b => (b.title + b.author).toLowerCase().includes(s) && activeTags.every(t => b.tags.includes(t)) && (isMyShelfMode ? savedBooks.includes(b.id) : true));
    if (currentSortMode === 'new') f.sort((a, b) => new Date(b.updated) - new Date(a.updated)); else f.sort((a, b) => b.likes - a.likes);
    document.getElementById("grid").innerHTML = f.map((b, i) => generateCardHTML(b, i)).join("");
    document.getElementById("readerGrid").innerHTML = [...readerData].sort((a,b) => b.likes - a.likes).map((b, i) => generateReaderCardHTML(b, i)).join("");
    setTimeout(observeCards, 100);
  }

  function setAiPrompt(p) { document.getElementById("aiQuery").value = p; runAiConsult(); }
  function resetAi() { document.getElementById("aiQuery").value = ""; document.getElementById("aiResultArea").style.display = "none"; }
  function toggleMyShelf() { isMyShelfMode = !isMyShelfMode; document.getElementById("myShelfBtn").classList.toggle("active"); renderAll(); }
  function changeSortMode(m) { currentSortMode = m; document.getElementById("sortNewBtn").classList.toggle("active", m === 'new'); document.getElementById("sortLikeBtn").classList.toggle("active", m === 'like'); renderAll(); }
  async function fetchMood() { try { const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getMood" }) }); const d = await res.json(); document.getElementById("shelfMood").textContent = "✨ " + d.mood; } catch(e){} }
  function closeModal() { document.getElementById("submitModal").style.display = "none"; }
  function openModal() { document.getElementById("submitModal").style.display = "flex"; }
  function openDiagnoseModal() { document.getElementById("diagnoseModal").style.display = "flex"; }
  function closeDiagnoseModal() { document.getElementById("diagnoseModal").style.display = "none"; }
  function closeSummaryModal() { document.getElementById("summaryModal").style.display = "none"; }
  function closeGacha() { document.getElementById('gachaModal').style.display = 'none'; }
  function resetPrescription() { document.getElementById("worryInput").value = ""; document.getElementById("prescriptionResultArea").style.display = "none"; }
  async function handleAction(id, a) { const l = a === 'likeBook' ? likedBooks : readBooks; if (l.includes(id)) return; l.push(id); localStorage.setItem(a === 'likeBook' ? 'likedBooks' : 'readBooks', JSON.stringify(l)); if (a === 'readBook') spawnConfetti(); renderAll(); fetch(API_URL, { method: "POST", body: JSON.stringify({ action: a, pageId: id }) }); }
  function toggleSave(id) { if (savedBooks.includes(id)) savedBooks = savedBooks.filter(i => i !== id); else savedBooks.push(id); localStorage.setItem('savedBooks', JSON.stringify(savedBooks)); renderAll(); }
  function spawnConfetti() { for (let i = 0; i < 40; i++) { const c = document.createElement('div'); c.style.cssText = `position:fixed; width:10px; height:10px; background:#ffc0cb; left:${Math.random()*100}vw; animation: fall ${Math.random()*3+2}s linear forwards; z-index:4000;`; document.body.appendChild(c); setTimeout(() => c.remove(), 5000); } }
  function observeCards() { const o = new IntersectionObserver((es) => { es.forEach(e => { if (e.isIntersecting) { setTimeout(() => e.target.classList.add('show'), 50); o.unobserve(e.target); } }); }, { threshold: 0.1 }); document.querySelectorAll('.card:not(.show), .reader-card:not(.show)').forEach(c => o.observe(c)); }
  function generateFilterTags(bs) { const c = document.getElementById("tagsContainer"); const ts = new Set(); bs.forEach(b => b.tags.forEach(t => ts.add(t))); ts.forEach(t => { const b = document.createElement("button"); b.className = "filter-tag"; b.textContent = t; b.onclick = () => { b.classList.toggle("active"); if (activeTags.includes(t)) activeTags = activeTags.filter(x => x !== t); else activeTags.push(t); renderAll(); }; c.appendChild(b); }); }
  function playGacha() { if (gachaPool.length === 0) return; const m = document.getElementById('gachaModal'), s = document.getElementById('gachaSlotImg'), t = document.getElementById('gachaTitle'), d = document.getElementById('gachaDesc'), a = document.getElementById('gachaActions'); m.style.display = 'flex'; a.style.display = 'none'; t.innerHTML = "探索中..."; let c = 0; const i = setInterval(() => { s.src = gachaPool[Math.floor(Math.random() * gachaPool.length)].image; if (++c > 20) { clearInterval(i); const w = gachaPool[Math.floor(Math.random() * gachaPool.length)]; s.src = w.image; t.innerHTML = "✨ 運命の一冊！"; d.innerHTML = `『${w.title}』<br>${w.author}`; a.style.display = 'flex'; if (w.url && w.url !== "#") document.getElementById('gachaLinkBtn').onclick = () => window.open(w.url, '_blank'); else document.getElementById('gachaLinkBtn').style.display = 'none'; } }, 100); }
  async function submitBook() { const t = document.getElementById("submitTitle").value, r = document.getElementById("submitReason").value; if (!t || !r) return alert("必須項目を埋めてね"); try { await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "submitBook", data: { title: t, author: document.getElementById("submitAuthor").value, reason: r } }) }); alert("送信完了！"); closeModal(); } catch (e) { alert("失敗"); } }
  document.getElementById("updateDbBtn").onclick = async () => { const p = prompt("合言葉は？"); if (!p) return; const btn = event.target; btn.disabled = true; try { const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "updateDB", password: p }) }); const d = await res.json(); if (d.status === "success") { alert("学習完了！"); location.reload(); } else { alert(d.message); } } catch (e) { alert("エラー"); } finally { btn.disabled = false; } };
</script>
</body>
